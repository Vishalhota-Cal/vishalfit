<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VISHALXFIT — Train. Fuel. Peak.</title>
<meta name="theme-color" content="#0A0B0D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VISHALXFIT">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
/* Anton + JetBrains Mono are SIL Open Font License 1.1 — bundling permitted, including in a paid product. */
@font-face{
  font-family:'Anton'; font-style:normal; font-weight:400; font-display:swap;
  src:url('fonts/Anton-Regular.ttf') format('truetype');
}
@font-face{
  font-family:'JetBrains Mono'; font-style:normal; font-weight:500; font-display:swap;
  src:url('fonts/JetBrainsMono-Medium.ttf') format('truetype');
}

:root{
  /* ---- ground: near-black, not pure #000 (halates against acid on OLED) ---- */
  --ink:#0A0B0C;
  --ink-void:#000000;        /* reserved for the lightbox + boot curtain only */
  --sunken:#050506;          /* input wells, progress tracks, chart plot floor */
  --surface:#101215;
  --surface-raised:#16181A;
  --surface-hover:#1C2024;

  /* ---- the accent, rationed in three strengths ---- */
  --acid:#CCFF00;            /* signature — hero numeral, active nav, primary fill, gauge set 7, chart's last point */
  --acid-core:#B8E600;       /* workhorse — chart strokes, icons, accent text, "on target" */
  --acid-deep:#8FA800;       /* structural — dim/quiet state, area-fill stop, hover borders */
  --acid-wash:rgba(204,255,0,0.10);
  --acid-glow:rgba(204,255,0,0.28);

  --chalk:#F2F3F0;
  --ink-2:#9DA2A8;           /* secondary text, micro-labels — 7.3:1 */
  --ink-3:#6E747C;           /* tertiary + placeholders — was 2.22:1, now passes */

  --warn:#FFB020;            /* over-target */
  --danger:#D42A24;          /* destructive FILLS — white text on it passes AA */
  --danger-ink:#FF7A70;      /* destructive TEXT on dark */
  --danger-soft:rgba(212,42,36,0.14);

  /* borders carry elevation here — fills can't, surfaces sit too close to --ink to separate on their own */
  --line:rgba(242,243,240,0.08);
  --line-strong:rgba(242,243,240,0.16);
  --line-acid:rgba(204,255,0,0.32);
  --sheen:inset 0 1px 0 rgba(255,255,255,0.05);

  /* type scale: 7 sizes, not 15 */
  --fs-micro:11px; --fs-xs:12px; --fs-sm:13px; --fs-base:15px;
  --fs-input:16px; --fs-lg:17px;
  --fs-d3:15px; --fs-d2:22px; --fs-d1:clamp(28px,6vw,40px); --fs-hero:clamp(56px,17vw,88px);

  /* spacing, 4px base */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;

  /* radius — concentric: sm inside md inside lg */
  --r-sm:10px; --r-md:14px; --r-lg:20px;

  /* elevation — three steps, then stop. e2/e3 lean on border brightness, not fill. */
  --e1:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -12px rgba(0,0,0,.7);
  --e2:0 24px 60px -20px rgba(0,0,0,.85);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--ink);
  color:var(--chalk);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI Variable Text','Segoe UI',Roboto,system-ui,sans-serif;
  min-height:100dvh;
  -webkit-font-smoothing:antialiased;
  padding-bottom:76px;
  font-size:var(--fs-base);
}
::selection{background:var(--acid-wash);color:var(--chalk);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--surface-raised);border-radius:8px;}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
:focus-visible{outline:2px solid var(--acid);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){ *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;} }

/* ============================================================
   ANIMATION SYSTEM — springs, ripples, and the shared keyframes
   every interactive surface below draws from, so the whole app
   moves with one consistent "voice" instead of N components each
   inventing their own timing.
============================================================ */
:root{
  --ease-spring:cubic-bezier(.34,1.56,.64,1);   /* overshoot — nav pill, fills, count-ups */
  --ease-out:cubic-bezier(.16,1,.3,1);          /* snappy settle — page/card entrances */
  --ease-pop:cubic-bezier(.22,1.3,.36,1);       /* icon taps, ripples */
}
@keyframes cardIn{ from{opacity:0;transform:translateY(18px) scale(.96);} to{opacity:1;transform:translateY(0) scale(1);} }
@keyframes iconPop{ 0%{transform:scale(1) rotate(0);} 45%{transform:scale(1.28) rotate(-4deg);} 100%{transform:scale(1) rotate(0);} }
@keyframes rippleOut{ from{transform:scale(0);opacity:.55;} to{transform:scale(2.6);opacity:0;} }
@keyframes glowPulse{ 0%,100%{box-shadow:0 0 0 1px rgba(204,255,0,0.5),0 6px 20px -8px var(--acid-glow);} 50%{box-shadow:0 0 0 1px rgba(204,255,0,0.75),0 10px 34px -6px var(--acid-glow);} }
@keyframes heroGlow{ 0%,100%{opacity:.5;} 50%{opacity:1;} }
@keyframes toastIn{ from{opacity:0;transform:translate(-50%,16px) scale(.9);} to{opacity:1;transform:translate(-50%,0) scale(1);} }
@keyframes toastOut{ from{opacity:1;transform:translate(-50%,0) scale(1);} to{opacity:0;transform:translate(-50%,10px) scale(.92);} }

/* generic tap ripple — JS appends a <span class="ripple"> inside any
   .rippleable element, positioned at the pointer's coordinates. */
.ripple{
  position:absolute;border-radius:50%;background:var(--ripple-color, rgba(204,255,0,0.35));
  transform:scale(0);pointer-events:none;animation:rippleOut .55s var(--ease-out);
}
.rippleable{position:relative;overflow:hidden;}

.mono{font-family:'JetBrains Mono',ui-monospace,'SF Mono','Cascadia Mono','Roboto Mono',Menlo,Consolas,monospace; font-variant-numeric:tabular-nums;}
.display{font-family:'Anton','Arial Narrow',Impact,system-ui,sans-serif;font-weight:400;letter-spacing:0.02em;}

/* vertical rhythm — replaces ad-hoc inline spacers. Also applied inside the
   .fuel-narrow/.measure-narrow wrappers: those use display:contents so they
   don't affect desktop width, but that ALSO makes their children invisible
   to the `#app > * + *` selector (contents removes the box, not the DOM
   parent-child relationship the selector matches on) — without this second
   rule, cards inside them render with zero gap between them. */
#app > * + *{ margin-top:var(--s4); }
.fuel-narrow > * + *, .measure-narrow > * + *{ margin-top:var(--s4); }

/* ---------- SHELL (mobile: invisible; desktop: sidebar rail) ---------- */
.shell, .main{ display:contents; }
.rail{ display:none; }

/* ---------- HEADER ---------- */
.topbar{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg, var(--ink) 60%, rgba(10,11,13,0.92));
  backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);
  padding:calc(14px + env(safe-area-inset-top)) 18px 12px;
  display:flex;align-items:center;justify-content:flex-end;
  gap:10px;
}
.brand{display:flex;align-items:center;gap:10px;}
/* mobile: the wordmark is the logo, so it gets the visual center of the
   header instead of sitting to the left of the icon buttons — pulled out
   of flex flow so topbar-actions' width never pushes it off-center. */
.topbar .brand{position:absolute;left:50%;transform:translateX(-50%);}
.topbar .brand-text{text-align:center;}
.brand-text .display{font-size:20px;line-height:1;color:var(--chalk);}
.brand-text .tag{font-size:var(--fs-micro);color:var(--ink-2);letter-spacing:0.14em;text-transform:uppercase;margin-top:2px;}

/* ---- wordmark-as-logo: no separate icon glyph, just the type treatment,
   plus one recurring "running" motif — a light sweep that runs across the
   letters every few seconds instead of sitting static. ---- */
.display.logo-shine{
  background-image:linear-gradient(115deg, var(--chalk) 42%, var(--acid) 50%, var(--chalk) 58%);
  background-size:250% 100%; background-position:180% 0;
  -webkit-background-clip:text; background-clip:text;
  color:transparent; -webkit-text-fill-color:transparent;
}
@keyframes logoShine{ 0%,82%{background-position:180% 0;} 100%{background-position:-60% 0;} }
.brand-text .display.logo-shine{ animation:logoShine 7s ease-in-out 2s infinite; }
@supports not (background-clip:text){
  .display.logo-shine{ color:var(--chalk); -webkit-text-fill-color:var(--chalk); background:none; }
}
.topbar-actions{display:flex;align-items:center;gap:6px;}
.topbar-clockbar{
  display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  padding:8px 18px;border-bottom:1px solid var(--line);background:var(--ink);
}
.topbar-clockbar .greeting{font-family:'Anton','Arial Narrow',Impact,sans-serif;font-size:15px;color:var(--chalk);letter-spacing:0.01em;}
.topbar-clockbar .clock{font-size:var(--fs-xs);color:var(--ink-2);white-space:nowrap;}
/* ---------- NAV ---------- */
.navbar{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  display:flex;background:var(--surface);border-top:1px solid var(--line);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom));
}
/* the pill glides between tabs via pure CSS :has() — no JS measurement,
   no resize listeners, just the same .active toggle switchTab() already
   does. Falls back to a static per-button wash (below) on browsers
   without :has() support. */
.nav-indicator{
  position:absolute;top:6px;bottom:calc(6px + env(safe-area-inset-bottom));left:6px;
  width:calc((100% - 12px)/5);transform:translateX(0%);
  background:var(--acid-wash);border:1px solid var(--line-acid);border-radius:10px;
  transition:transform .45s var(--ease-spring);pointer-events:none;z-index:0;
}
.navbar:has(.navbtn[data-tab="dashboard"].active) .nav-indicator{transform:translateX(0%);}
.navbar:has(.navbtn[data-tab="train"].active) .nav-indicator{transform:translateX(100%);}
.navbar:has(.navbtn[data-tab="fuel"].active) .nav-indicator{transform:translateX(200%);}
.navbar:has(.navbtn[data-tab="measure"].active) .nav-indicator{transform:translateX(300%);}
.navbar:has(.navbtn[data-tab="photos"].active) .nav-indicator{transform:translateX(400%);}
.navbtn{
  position:relative;z-index:1;flex:1;background:none;border:none;color:var(--ink-2);
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:8px 2px;border-radius:10px;font-size:var(--fs-micro);font-weight:600;
  letter-spacing:0.04em;text-transform:uppercase;
  transition:color .2s, transform .15s var(--ease-pop);
  min-height:44px;justify-content:center;overflow:hidden;
}
.navbtn svg{width:20px;height:20px;transition:filter .3s;}
.navbtn.active{color:var(--acid);}
.navbtn.active svg{filter:drop-shadow(0 0 6px rgba(204,255,0,0.55));animation:iconPop .45s var(--ease-pop);}
.navbtn:hover{color:var(--chalk);}
.navbtn:active{transform:scale(0.9);}
/* browsers without :has() (pre-2022 Safari) never match the rules above —
   this keeps every tab visibly selected there instead of showing nothing. */
@supports not selector(:has(a)){
  .navbtn.active{background:var(--acid-wash);}
}

/* ---------- LAYOUT ---------- */
.wrap{max-width:640px;margin:0 auto;padding:var(--s4) var(--s4) var(--s6);}
.section-row{display:flex;align-items:center;justify-content:space-between;margin:4px 0 var(--s4);}
.section-title{
  font-family:'Anton','Arial Narrow',Impact,system-ui,sans-serif;font-size:var(--fs-d2);letter-spacing:0.01em;
  color:var(--chalk); margin:0;
}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  padding:var(--s4); box-shadow:var(--sheen);
  transition:transform .25s var(--ease-out), box-shadow .25s, border-color .25s;
}
@media (hover:hover){
  .card:hover{transform:translateY(-2px);border-color:var(--line-strong);box-shadow:var(--sheen), var(--e1);}
}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s3);gap:8px;}
.card-head h3{margin:0;font-size:var(--fs-micro);text-transform:uppercase;letter-spacing:0.09em;color:var(--ink-2);font-weight:700;}
.card-head h3.accent{color:var(--acid);}
.row{display:flex;gap:10px;}
.row > *{flex:1;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}

label{display:block;font-size:var(--fs-micro);color:var(--ink-2);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:5px;font-weight:600;}
input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{
  width:100%;background:var(--surface-raised);border:1px solid var(--line-strong);
  color:var(--chalk);padding:10px 11px;border-radius:var(--r-sm);font-size:var(--fs-input);
}
input::placeholder{color:var(--ink-3);}
textarea{resize:vertical;min-height:56px;}
.field{margin-bottom:var(--s3);}

.btn{
  position:relative;overflow:hidden;
  border:none;border-radius:var(--r-sm);padding:11px 16px;font-weight:700;font-size:var(--fs-sm);
  letter-spacing:0.03em;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  transition:transform .18s var(--ease-pop), opacity .12s ease, box-shadow .2s;
  min-height:44px;
}
.btn:active{transform:scale(0.94);}
.btn-primary{background:var(--acid);color:#0A0B0C;font-weight:800;box-shadow:0 0 0 1px rgba(204,255,0,0.5),0 6px 20px -8px var(--acid-glow);--ripple-color:rgba(10,11,12,0.28);}
.btn-primary.hero-cta{animation:glowPulse 2.6s ease-in-out infinite;}
.btn-primary.hero-cta:hover, .btn-primary.hero-cta:active{animation:none;}
.btn-danger{background:var(--danger);color:#1a0505;}
.btn-ghost{background:var(--surface-raised);color:var(--chalk);border:1px solid var(--line-strong);}
.btn-ghost.accent{background:transparent;color:var(--acid-core);border:1px solid var(--line-acid);}
.btn-block{width:100%;}
.btn-sm{padding:7px 11px;font-size:var(--fs-xs);border-radius:8px;min-height:36px;}
@media (hover:hover){
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 0 0 1px rgba(204,255,0,0.6),0 10px 28px -8px var(--acid-glow);}
  .btn-ghost:hover{background:var(--surface-hover);border-color:var(--line-strong);}
  .btn-ghost.accent:hover{background:var(--acid-wash);border-color:var(--acid-deep);}
}
.icon-btn{
  position:relative;overflow:hidden;
  background:none;border:none;color:var(--ink-2);padding:6px;border-radius:8px;
  min-width:40px;min-height:40px;display:inline-flex;align-items:center;justify-content:center;
  transition:color .2s, background .2s, transform .15s var(--ease-pop);
}
@media (hover:hover){ .icon-btn:hover{color:var(--chalk);background:var(--surface-raised);} }
.icon-btn:active{transform:scale(0.88);}
.icon-btn.is-busy{opacity:.5;pointer-events:none;}
.icon-btn svg{width:18px;height:18px;}

.muted{color:var(--ink-2);}
.warn-text{color:var(--warn);}
.small{font-size:var(--fs-xs);}
.divider{height:1px;background:var(--line);margin:var(--s4) 0;}
.tag-pill{
  font-size:var(--fs-micro);font-weight:700;text-transform:uppercase;letter-spacing:0.06em;
  padding:3px 8px;border-radius:20px;background:var(--surface-raised);color:var(--ink-2);
  display:inline-block;
}
.tag-fst{background:var(--acid-wash);color:var(--acid);}
.datum{display:inline-flex;flex-direction:column;gap:2px;margin:0 var(--s3) var(--s2) 0;}
.datum .v{font-family:ui-monospace,'SF Mono',monospace;font-size:var(--fs-sm);color:var(--chalk);}
.datum .l{font-size:var(--fs-micro);color:var(--ink-2);text-transform:uppercase;letter-spacing:0.06em;}
.empty-state{
  text-align:center;padding:var(--s7) var(--s4);color:var(--ink-2);
}
.empty-state .display{font-size:19px;color:var(--chalk);margin-bottom:6px;}
.empty-state .btn{margin-top:var(--s4);}

/* ---------- DASHBOARD (hero) ---------- */
.dash{display:grid;gap:var(--s4);grid-template-columns:1fr;}
/* hero: the one big screenshot-worthy number. One accent glow lives here — nowhere else. */
.hero{
  position:relative;overflow:hidden;padding:var(--s5) var(--s4);
  border:1px solid var(--line-acid);
  background:radial-gradient(120% 140% at 0% 0%, rgba(204,255,0,0.07), transparent 60%), var(--surface);
  box-shadow:var(--sheen), 0 24px 60px -28px rgba(204,255,0,0.18);
}
.hero::after{
  content:'';position:absolute;inset:-40% -20% auto auto;width:70%;height:140%;pointer-events:none;
  background:radial-gradient(closest-side, rgba(204,255,0,0.14), transparent 70%);
  animation:heroGlow 5s ease-in-out infinite;
}
.hero-label{font-size:var(--fs-micro);letter-spacing:0.1em;color:var(--ink-2);text-transform:uppercase;}
.hero-value{
  font-family:'Anton','Arial Narrow',Impact,sans-serif;font-size:var(--fs-hero);line-height:0.86;color:var(--acid);
  text-shadow:0 0 28px rgba(204,255,0,0.30); margin-top:6px; position:relative; z-index:1;
}
.hero-unit{font-size:14px;color:var(--ink-2);margin-left:8px;text-transform:lowercase;}
.hero-sub{font-size:var(--fs-sm);color:var(--acid-core);margin-top:6px;position:relative;z-index:1;}
.mission-stats{
  display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;position:relative;z-index:1;
  font-size:var(--fs-sm);color:var(--acid-core);
}
.mission-stats span{position:relative;padding-left:14px;}
.mission-stats span:first-child{padding-left:0;}
.mission-stats span::before{content:'';position:absolute;left:4px;top:50%;transform:translateY(-50%);width:3px;height:3px;border-radius:50%;background:var(--acid-deep);}
.mission-stats span:first-child::before{display:none;}

/* Weekly PPL timeline — This Week card */
.ppl-timeline{display:flex;gap:4px;margin-top:2px;}
.ppl-day{flex:1;min-width:0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;}
.ppl-day .wd{font-size:var(--fs-micro);color:var(--ink-2);text-transform:uppercase;letter-spacing:.03em;}
.ppl-day.today .wd{color:var(--acid-core);font-weight:700;}
.ppl-dot{
  width:16px;height:16px;border-radius:50%;background:transparent;border:1px solid var(--line-strong);
  display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;
  transition:transform .2s var(--ease-pop);
}
.ppl-dot.done{background:var(--acid);border-color:var(--acid);color:#0d1400;box-shadow:0 0 8px var(--acid-glow);}
.ppl-dot.due{border-color:var(--warn);}
.ppl-dot.due.pulse{animation:pulse7 1.4s ease-in-out infinite;}
.ppl-dot.rest{border-color:var(--line);opacity:.5;}

/* Today's Performance */
.perf-score{display:flex;align-items:baseline;gap:10px;margin:2px 0 12px;}
.perf-score .countup{
  font-family:'Anton','Arial Narrow',Impact,sans-serif;font-size:clamp(34px,8vw,46px);
  color:var(--acid);line-height:1;text-shadow:0 0 20px rgba(204,255,0,0.22);
}
.perf-label{font-size:var(--fs-xs);color:var(--ink-2);text-transform:uppercase;letter-spacing:0.08em;font-weight:700;}
.perf-parts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.perf-part{display:flex;justify-content:space-between;font-size:var(--fs-xs);color:var(--ink-2);padding:7px 9px;background:var(--surface-raised);border-radius:8px;}
.perf-part-value{color:var(--chalk);}
.hero-empty{font-size:var(--fs-sm);color:var(--ink-2);margin-top:14px;max-width:36ch;position:relative;z-index:1;}
.hero-spark{position:absolute;right:0;bottom:0;width:56%;height:52%;pointer-events:none;}
/* Fuel tab's "today" figure — a scaled-down echo of .hero-value so the
   kcal number reads as THE number on this card, not just another row. */
.kcal-hero{margin-bottom:14px;}
.kcal-hero-value{
  font-family:'Anton','Arial Narrow',Impact,sans-serif;font-size:clamp(36px,9vw,52px);line-height:0.9;color:var(--acid);
  text-shadow:0 0 20px rgba(204,255,0,0.22);
}
.kcal-hero-unit{font-size:14px;color:var(--ink-2);margin-left:8px;text-transform:lowercase;}
.kcal-hero-sub{font-size:var(--fs-xs);color:var(--ink-2);margin-top:4px;letter-spacing:0.03em;text-transform:uppercase;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.stat-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s3);
  box-shadow:var(--sheen);transition:transform .25s var(--ease-out), border-color .25s;
}
@media (hover:hover){ .stat-card:hover{transform:translateY(-2px);border-color:var(--line-strong);} }
.stat-card .label{font-size:var(--fs-micro);text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-2);font-weight:700;margin-bottom:6px;}
.stat-card .value{font-family:'Anton','Arial Narrow',Impact,sans-serif;font-size:var(--fs-d1);color:var(--chalk);line-height:1;}
.stat-card .value.accent{color:var(--acid);}
.stat-card .sub{font-size:var(--fs-xs);color:var(--ink-2);margin-top:4px;}
.stat-card .sub.up{color:var(--acid-core);}
.stat-card .spark{margin-top:6px;height:22px;}
.quickgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.qbtn{
  position:relative;overflow:hidden;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  padding:16px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;
  color:var(--chalk);text-align:left; box-shadow:var(--sheen); min-height:44px;
  transition:transform .18s var(--ease-pop), border-color .25s, background .25s;
}
.qbtn svg{width:22px;height:22px;color:var(--acid);transition:transform .3s var(--ease-spring);}
.qbtn:active{transform:scale(0.95);}
.qbtn:active svg{transform:scale(1.15) rotate(-6deg);}
@media (hover:hover){ .qbtn:hover{transform:translateY(-2px);border-color:var(--line-acid);background:var(--surface-hover);} }
.qbtn .qlabel{font-weight:700;font-size:var(--fs-sm);}

/* macro bars */
.macrobar{margin-bottom:10px;}
.macrobar-top{display:flex;justify-content:space-between;font-size:var(--fs-xs);margin-bottom:5px;}
.macrobar-track{height:8px;border-radius:8px;background:var(--surface-raised);overflow:hidden;position:relative;}
.macrobar-fill{height:100%;border-radius:8px;position:absolute;left:0;top:0;width:0;transition:width .8s var(--ease-spring);}
.macrobar-over{height:100%;border-radius:8px;position:absolute;top:0;background:var(--warn);opacity:0.85;width:0;transition:width .8s var(--ease-spring) .1s;}

/* ---------- 7 GAUGE (signature): vertical staves, ordinal ramp ---------- */
.gauge7-panel{background:var(--surface-raised);border:1px solid var(--line-strong);border-radius:var(--r-md);padding:var(--s3);}
.gauge7{display:flex;gap:5px;align-items:flex-end;height:56px;margin:6px 0 8px;}
.gauge7 .seg{
  flex:1;height:100%;border-radius:5px;background:var(--surface);
  border:1px solid var(--line-strong);position:relative;overflow:visible;
  display:flex;align-items:flex-end;
}
.gauge7 .seg .fill{
  width:100%;border-radius:4px;height:0%;transition:height .25s ease;
}
.gauge7 .seg.filled .fill{height:100%;}
.gauge7 .seg.pulse .fill{animation:pulse7 1.1s ease-in-out infinite;}
@keyframes pulse7{
  0%,100%{filter:drop-shadow(0 0 0 rgba(204,255,0,0));}
  50%{filter:drop-shadow(0 0 6px rgba(204,255,0,0.75));}
}
.rest-timer{
  display:flex;align-items:center;gap:12px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;margin-top:8px;
}
.rest-timer .ring{width:36px;height:36px;flex-shrink:0;}
.rest-timer .ring circle{transition:stroke-dashoffset .95s linear;}
.rest-timer .txt{font-size:var(--fs-xs);color:var(--ink-2);}
.rest-timer .txt b{color:var(--chalk);}
/* execution-mode variant: bigger ring, currentColor so the urgent state
   (last 10s) is a single class toggle instead of JS style writes */
.rest-timer.rest-lg{gap:14px;color:var(--acid);flex-wrap:wrap;}
.rest-timer.rest-lg .ring{width:52px;height:52px;}
.rest-timer.rest-lg .txt{font-size:var(--fs-sm);}
.rest-timer.rest-urgent{color:var(--warn);}
.rest-timer.rest-done{animation:glowPulse 1.1s var(--ease-out) 2;}

/* ---------- EXECUTION MODE: checklist row ---------- */
.exec-active{position:relative;overflow:visible;}
.exec-check{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-md);
  padding:14px 16px;font-size:var(--fs-base);font-weight:600;color:var(--ink-2);
  transition:border-color .18s, background .18s, color .18s, transform .12s var(--ease-pop);
}
.exec-check:active{transform:scale(0.98);}
.exec-check-dot{
  width:26px;height:26px;flex-shrink:0;border-radius:50%;border:2px solid var(--line-strong);
  display:flex;align-items:center;justify-content:center;color:#0d1400;
  transition:background .18s, border-color .18s;
}
.exec-check-dot svg{width:15px;height:15px;}
.exec-check.is-done{border-color:var(--line-acid);background:var(--acid-wash);color:var(--chalk);}
.exec-check.is-done .exec-check-dot{background:var(--acid);border-color:var(--acid);box-shadow:0 0 10px var(--acid-glow);animation:iconPop .3s var(--ease-pop);}
.set-row.done{box-shadow:inset 2px 0 0 var(--acid);padding-left:6px;border-radius:4px;}
@keyframes setRowIn{from{opacity:0;transform:translateX(-10px);}to{opacity:1;transform:translateX(0);}}
@keyframes setRowFlash{0%{background:rgba(204,255,0,.18);}100%{background:transparent;}}
.set-row-in{animation:setRowIn .34s var(--ease-out), setRowFlash 1s var(--ease-out);}
@keyframes setRowOut{to{opacity:0;transform:translateX(14px);}}
.set-row-out{animation:setRowOut .18s var(--ease-out) forwards;}
@keyframes setFlash{
  0%{opacity:0;transform:translate(-50%,6px) scale(.9);}
  18%{opacity:1;transform:translate(-50%,0) scale(1);}
  75%{opacity:1;}
  100%{opacity:0;transform:translate(-50%,-16px) scale(.98);}
}
.set-flash{
  position:absolute;left:50%;top:-6px;z-index:2;pointer-events:none;
  padding:6px 14px;border-radius:14px;background:var(--acid);color:#0d1400;
  font-size:var(--fs-micro);letter-spacing:.14em;text-transform:uppercase;font-weight:700;
  white-space:nowrap;animation:setFlash 1.1s var(--ease-out) forwards;
}
.exec-swap{animation:cardIn .4s var(--ease-out);}
.modal-overlay.no-anim, .modal-sheet.no-anim{animation:none;}

/* countdown overlay — mounts in #fxRoot, not #modalRoot */
#fxRoot{pointer-events:none;}
.cd{
  position:fixed;inset:0;z-index:300;pointer-events:auto;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;
  background:radial-gradient(circle at 50% 45%, rgba(204,255,0,.10), rgba(4,4,5,.94) 60%);
  backdrop-filter:blur(4px);animation:overlayIn .2s var(--ease-out);
}
@keyframes cdOut{to{opacity:0;transform:scale(1.04);}}
.cd.cd-out{animation:cdOut .22s var(--ease-out) forwards;}
.cd-num{
  font-size:clamp(90px,30vw,190px);line-height:1;color:var(--acid);
  text-shadow:0 0 60px var(--acid-glow);animation:cdPop .5s var(--ease-pop);
}
@keyframes cdPop{from{opacity:0;transform:scale(1.7);}60%{opacity:1;}to{opacity:1;transform:scale(1);}}
.cd-ring{
  position:absolute;width:min(62vw,300px);aspect-ratio:1;border-radius:50%;
  border:1px solid var(--line-acid);animation:cdRing 600ms var(--ease-out) infinite;
}
@keyframes cdRing{from{transform:scale(.72);opacity:.75;}to{transform:scale(1.12);opacity:0;}}
.cd-hint{font-size:var(--fs-micro);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-2);}
.cd-waiting .cd-num{animation:glowPulse 1s var(--ease-out) infinite;}

/* PR overlay — top-anchored banner, never a full-screen blocker */
.pr{position:fixed;left:0;right:0;top:calc(10px + env(safe-area-inset-top));z-index:160;
  display:flex;justify-content:center;pointer-events:none;}
.pr-card{
  pointer-events:auto;position:relative;max-width:420px;margin:0 12px;
  padding:14px 18px;border-radius:var(--r-lg);background:var(--surface-raised);
  border:1px solid var(--line-acid);box-shadow:0 18px 50px -12px var(--acid-glow);
  display:flex;align-items:center;gap:12px;overflow:visible;
  animation:prIn .5s var(--ease-spring), glowPulse 2s var(--ease-out) .5s 2;
}
@keyframes prIn{from{opacity:0;transform:translateY(-26px) scale(.86);}to{opacity:1;transform:translateY(0) scale(1);}}
@keyframes prOut{to{opacity:0;transform:translateY(-18px) scale(.96);}}
.pr-card.pr-out{animation:prOut .26s var(--ease-out) forwards;}
.pr-emblem{width:38px;height:auto;flex:0 0 auto;}
.pr-spark{position:absolute;left:50%;top:50%;width:4px;height:4px;border-radius:50%;
  background:var(--acid);pointer-events:none;opacity:0;
  animation:sparkFly 1.1s var(--ease-out) var(--d) forwards;}
@keyframes sparkFly{
  0%{opacity:0;transform:rotate(var(--a)) translateY(0) scale(.4);}
  15%{opacity:1;}
  100%{opacity:0;transform:rotate(var(--a)) translateY(calc(-1 * var(--r))) scale(0);}
}

/* boot curtain */
#boot{
  position:fixed;inset:0;background:var(--ink);z-index:500;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
}
#boot .gauge7{width:140px;height:44px;animation:bootFillIn .9s var(--ease-spring) .1s backwards;filter:drop-shadow(0 0 10px rgba(204,255,0,0.35));}
#boot .display{font-size:22px;letter-spacing:0.06em;color:var(--chalk);animation:cardIn .5s var(--ease-out) .2s backwards;}
#boot .display.logo-shine{animation:cardIn .5s var(--ease-out) .2s backwards, logoShine 7s ease-in-out 1.6s infinite;}
#boot .tag{font-size:var(--fs-micro);color:var(--ink-2);letter-spacing:0.16em;text-transform:uppercase;animation:cardIn .5s var(--ease-out) .32s backwards;}
@keyframes bootFillIn{from{opacity:0;transform:scaleX(.7);}to{opacity:1;transform:scaleX(1);}}
/* boot exit + shell entrance — a deliberate crossfade instead of the
   curtain just vanishing the instant data finishes loading. */
#boot.boot-out{animation:bootOut .5s var(--ease-out) forwards;}
@keyframes bootOut{to{opacity:0;transform:scale(1.03);}}
.shell.shell-in{animation:shellReveal .6s var(--ease-out);}
@keyframes shellReveal{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

/* ---------- exercise / set rows ---------- */
.exercise-block{background:var(--surface-raised);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:var(--s3);}
.exercise-block-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;}
.exercise-name-input{flex:1;}
.set-row{display:grid;grid-template-columns:28px 1fr 1fr auto;gap:8px;align-items:center;margin-bottom:6px;}
.set-row .idx{font-family:ui-monospace,monospace;font-size:var(--fs-xs);color:var(--ink-2);text-align:center;}
.set-row input{padding:8px 9px;font-size:var(--fs-input);}
.chk-wrap{display:flex;align-items:center;gap:7px;font-size:var(--fs-xs);color:var(--ink-2);user-select:none;}
.chk-wrap input{width:auto;accent-color:var(--acid);}

/* ---------- history list ---------- */
.hist-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:13px 14px;box-shadow:var(--sheen);transition:transform .2s var(--ease-out), border-color .2s;}
.hist-item:active{transform:scale(0.98);}
@media (hover:hover){ .hist-item:hover{border-color:var(--line-strong);transform:translateY(-1px);} }
.hist-top{display:flex;justify-content:space-between;align-items:flex-start;background:none;border:none;width:100%;color:inherit;text-align:left;padding:0;min-height:0;}
.hist-date{font-family:ui-monospace,monospace;font-size:var(--fs-xs);color:var(--ink-2);}
.hist-title{font-weight:700;font-size:var(--fs-lg);margin-top:2px;}
.hist-body{margin-top:10px;font-size:var(--fs-xs);color:var(--ink-2);}
.hist-body div{margin-bottom:3px;}
.hist-body b{color:var(--chalk);}
.hist-actions{display:flex;gap:6px;margin-top:8px;}

/* ---------- modal ---------- */
.modal-overlay{
  position:fixed;inset:0;background:rgba(4,4,5,0.72);z-index:100;
  display:flex;align-items:flex-end;justify-content:center;
  backdrop-filter:blur(0px);
  animation:overlayIn .28s var(--ease-out);
}
@keyframes overlayIn{from{opacity:0;backdrop-filter:blur(0px);}to{opacity:1;backdrop-filter:blur(3px);}}
.modal-sheet{
  background:var(--ink);border-top-left-radius:var(--r-lg);border-top-right-radius:var(--r-lg);
  width:100%;max-width:640px;max-height:88dvh;overflow-y:auto;
  padding:var(--s4) var(--s4) calc(20px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line-strong);
  box-shadow:var(--e2);
  animation:slideUp .38s var(--ease-spring);
}
@keyframes slideUp{from{transform:translateY(32px) scale(.98);opacity:0;}to{transform:translateY(0) scale(1);opacity:1;}}
@keyframes zoomIn{from{transform:scale(0.92);opacity:0;}to{transform:scale(1);opacity:1;}}
@keyframes tabFade{from{opacity:0;transform:translateY(10px) scale(.985);}to{opacity:1;transform:translateY(0) scale(1);}}
#app.fade-in{animation:tabFade .32s var(--ease-out);}
/* every render replays this — including a save, not just a tab switch
   (see renderApp()'s comment on #app.fade-in) — cheap, and it's exactly
   what makes the app feel alive rather than just "not broken". */
#app.fade-in > *,
#app.fade-in .photo-grid > *,
#app.fade-in .quickgrid > *,
#app.fade-in .stat-grid > *{
  animation:cardIn .5s var(--ease-out) backwards;
}
#app.fade-in > *:nth-child(1), #app.fade-in .photo-grid > *:nth-child(1), #app.fade-in .quickgrid > *:nth-child(1), #app.fade-in .stat-grid > *:nth-child(1){animation-delay:.03s;}
#app.fade-in > *:nth-child(2), #app.fade-in .photo-grid > *:nth-child(2), #app.fade-in .quickgrid > *:nth-child(2), #app.fade-in .stat-grid > *:nth-child(2){animation-delay:.07s;}
#app.fade-in > *:nth-child(3), #app.fade-in .photo-grid > *:nth-child(3), #app.fade-in .quickgrid > *:nth-child(3), #app.fade-in .stat-grid > *:nth-child(3){animation-delay:.11s;}
#app.fade-in > *:nth-child(4), #app.fade-in .photo-grid > *:nth-child(4), #app.fade-in .quickgrid > *:nth-child(4), #app.fade-in .stat-grid > *:nth-child(4){animation-delay:.15s;}
#app.fade-in > *:nth-child(5), #app.fade-in .photo-grid > *:nth-child(5), #app.fade-in .stat-grid > *:nth-child(5){animation-delay:.19s;}
#app.fade-in > *:nth-child(6), #app.fade-in .photo-grid > *:nth-child(6), #app.fade-in .stat-grid > *:nth-child(6){animation-delay:.23s;}
#app.fade-in > *:nth-child(7), #app.fade-in .photo-grid > *:nth-child(7){animation-delay:.27s;}
#app.fade-in > *:nth-child(n+8), #app.fade-in .photo-grid > *:nth-child(n+8){animation-delay:.30s;}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--s4);}
.modal-head h2{font-family:'Anton','Arial Narrow',sans-serif;font-size:21px;margin:0;font-weight:400;}
.confirm-sheet .modal-sheet{max-width:400px;text-align:center;}
.confirm-sheet .row{margin-top:var(--s4);}

/* ---------- chart ---------- */
.chartwrap{width:100%;position:relative;}
.chartwrap svg{width:100%;height:auto;display:block;touch-action:pan-y;}
.chart-tooltip{
  position:absolute;pointer-events:none;background:var(--surface-raised);border:1px solid var(--line-strong);
  border-radius:8px;padding:6px 9px;font-size:var(--fs-xs);box-shadow:var(--e1);white-space:nowrap;
  transform:translate(-50%,-115%);display:none;z-index:5;
}
.spark-svg{width:100%;height:100%;display:block;}

/* photos */
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.photo-thumb{position:relative;border-radius:var(--r-sm);overflow:hidden;aspect-ratio:3/4;background:var(--surface-raised);border:1px solid var(--line);padding:0;transition:transform .2s var(--ease-pop), border-color .2s;}
.photo-thumb:active{transform:scale(0.94);}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s var(--ease-out);}
@media (hover:hover){ .photo-thumb:hover{border-color:var(--line-acid);} .photo-thumb:hover img{transform:scale(1.08);} }
.photo-thumb .cap{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(0deg, rgba(0,0,0,0.75), transparent);padding:5px 6px 4px;font-size:9.5px;color:var(--chalk);}
.pose-pill{position:absolute;top:5px;left:5px;font-size:8.5px;font-weight:700;text-transform:uppercase;background:rgba(0,0,0,0.55);padding:2px 6px;border-radius:20px;}
.lightbox{position:fixed;inset:0;background:rgba(5,5,6,0.94);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
.lightbox img{max-width:100%;max-height:76dvh;border-radius:var(--r-sm);object-fit:contain;}

.upload-drop{
  border:1.5px dashed var(--line-strong);border-radius:var(--r-sm);padding:24px 12px;text-align:center;
  color:var(--ink-2);font-size:var(--fs-sm);cursor:pointer;background:none;width:100%;
}
.upload-drop.dragover{border-color:var(--acid);color:var(--chalk);background:var(--acid-wash);}
@media (hover:hover){ .upload-drop:hover{border-color:var(--acid);color:var(--chalk);background:var(--acid-wash);} }

.compare-select{display:flex;gap:8px;margin-bottom:var(--s3);}
.compare-view{position:relative;border-radius:var(--r-sm);overflow:hidden;aspect-ratio:3/4;background:var(--surface-raised);touch-action:none;}
.compare-view img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;}
.compare-view img.top{opacity:1;transition:opacity .05s linear;}
.compare-head{display:flex;justify-content:space-between;font-size:var(--fs-xs);color:var(--ink-2);margin-bottom:6px;}
.compare-hint{text-align:center;font-size:var(--fs-micro);color:var(--ink-2);margin-top:6px;text-transform:uppercase;letter-spacing:0.06em;}

.toast{
  position:fixed;bottom:86px;left:50%;transform:translateX(-50%);
  background:var(--surface-raised);border:1px solid var(--line-strong);color:var(--chalk);
  padding:10px 18px;border-radius:20px;font-size:var(--fs-sm);z-index:150;
  box-shadow:var(--e1); display:flex;align-items:center;gap:8px;max-width:88vw;
  animation:toastIn .4s var(--ease-spring);
}
.toast.toast-out{animation:toastOut .22s var(--ease-out) forwards;}
.toast.success{border-color:rgba(111,191,134,0.4);}
.toast.error{border-color:rgba(255,77,77,0.5);background:var(--danger-soft);}
.toast .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:var(--ink-2);}
.toast.success .dot{background:var(--acid-core);}
.toast.error .dot{background:var(--danger);}

.storage-banner{
  position:fixed;top:0;left:0;right:0;z-index:400;background:var(--danger);color:#1a0505;
  padding:10px 16px;text-align:center;font-size:var(--fs-sm);font-weight:700;
}

/* settings */
.settings-section{margin-bottom:var(--s5);}
.settings-section h4{font-size:var(--fs-micro);text-transform:uppercase;letter-spacing:0.09em;color:var(--ink-2);margin:0 0 var(--s2);}
.kv-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:var(--fs-sm);}
.kv-row:last-child{border-bottom:none;}

@media (min-width:641px){
  .wrap{max-width:720px;}
  .stat-grid{grid-template-columns:repeat(3,1fr);}
}

@media (min-width:1024px){
  .shell{
    display:grid; grid-template-columns:248px minmax(0,1fr); min-height:100dvh;
  }
  .main{ display:flex; flex-direction:column; min-width:0; }
  /* These three were previously keyed off 641px — but .navbar sits AFTER
     .shell in the DOM, so un-fixing it there (position:relative) made it
     render in normal flow BELOW all page content on any 641–1023px viewport
     (iPhone landscape included), instead of pinned to the bottom. They only
     make sense here, where .navbar actually goes display:none and the rail
     takes over — the mobile bottom nav now stays fixed all the way to 1024px. */
  body{padding-bottom:0;}
  .toast{bottom:24px;}
  .navbar{
    display:none;
  }
  .rail{
    display:flex; position:sticky; top:0; height:100dvh; z-index:30;
    flex-direction:column; align-items:stretch; gap:2px;
    background:var(--surface); border-right:1px solid var(--line);
    padding:20px 12px;
  }
  .rail .brand{margin:0 8px 28px;}
  .topbar .brand{display:none;}
  .rail .railbtn{
    display:flex;flex-direction:row;align-items:center;gap:12px;
    background:none;border:none;color:var(--ink-2);
    padding:11px 14px;border-radius:10px;font-size:var(--fs-sm);font-weight:600;
    position:relative;text-align:left;overflow:hidden;
    transition:color .2s, background .25s, transform .15s var(--ease-pop);
  }
  .rail .railbtn svg{width:19px;height:19px;flex-shrink:0;transition:filter .3s;}
  .rail .railbtn:hover{background:var(--surface-hover);color:var(--chalk);}
  .rail .railbtn:active{transform:scale(0.97);}
  .rail .railbtn.active{color:var(--acid);background:var(--acid-wash);}
  .rail .railbtn.active svg{filter:drop-shadow(0 0 5px rgba(204,255,0,0.5));animation:iconPop .45s var(--ease-pop);}
  .rail .railbtn::before{
    content:'';position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--acid);
    opacity:0;transform:scaleY(.3);transform-origin:center;
    transition:opacity .25s var(--ease-out), transform .3s var(--ease-spring);
  }
  .rail .railbtn.active::before{opacity:1;transform:scaleY(1);}
  .wrap{max-width:1080px;padding:28px 32px 48px;}
  .modal-overlay{align-items:center;}
  .modal-sheet{max-width:560px;border-radius:var(--r-lg);max-height:84dvh;animation:zoomIn .18s ease;}

  .dash{grid-template-columns:repeat(12,1fr);}
  .dash > .hero{grid-column:1 / -1;min-height:200px;}
  .dash > .dash-fuel{grid-column:span 12;}
  .dash > .dash-checklist{grid-column:span 3;}
  .dash > .dash-streak{grid-column:span 3;}
  .dash > .dash-performance{grid-column:span 6;}
  .dash > .dash-quick{grid-column:span 6;display:grid;grid-template-columns:1fr;}
  .dash > .dash-quick .quickgrid{grid-template-columns:repeat(4,1fr);}

<script>
/* ============================================================
   BRAND MARK — the seven-staves motif, reused everywhere:
   app icon, topbar mark, boot curtain, FST-7 gauge.
============================================================ */
function sevenStavesSvg(opts){
  const o = Object.assign({bars:7, gap:1, filled:7, activeIdx:-1, rounded:true}, opts||{});
  const n = o.bars;
  const w = 100, h = 100;
  const gap = o.gap;
  const barW = (w - gap*(n-1)) / n;
  let out = `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">`;
  for(let i=0;i<n;i++){
    const t = i/(n-1);
    const barH = h * (0.28 + 0.72 * Math.pow((i+1)/n, 1.3));
    const x = i*(barW+gap);
    const y = h - barH;
    const filled = i < o.filled;
    const active = i === o.activeIdx;
    const color = filled ? lerpAcid(t) : 'var(--surface-raised)';
    out += `<rect x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${barW.toFixed(2)}" height="${barH.toFixed(2)}" rx="2" fill="${color}" ${active?'class="stave-active"':''}/>`;
  }
  out += `</svg>`;
  return out;
}
// Validated 7-step acid ordinal ramp for the FST-7 gauge: lightness-monotone,
// every adjacent step >=0.06 delta-L apart (individually distinguishable),
// dark end still clears its track. Set 7 lands on full-strength --acid —
// the brightest pixel in the app appears exactly when the burnout set finishes.
const ACID_RAMP_7 = ['#4A5A16','#5E721B','#738A20','#89A425','#A0BE2A','#B6D92F','#CCFF00'];
function lerpAcid(t){
  const idx = Math.round(t * (ACID_RAMP_7.length-1));
  return ACID_RAMP_7[Math.max(0, Math.min(ACID_RAMP_7.length-1, idx))];
}

/* ============================================================
   DATA + CONSTANTS — fetched once at boot from GET /api/meta
   (the server's referenceData.js owns these now; see Architecture
   decision in the plan for why this moved out of the client).
============================================================ */
let EXERCISE_LIBRARY_DEFAULT = [];
let FOOD_LIBRARY_DEFAULT = [];
let PHASE_PRESETS = {};
let MEAL_SLOTS = [];

const OPENAI_MODEL_DEFAULT = "gpt-4o-mini";
// NOT hardcoded here on purpose — the single source of truth for the build
// version is sw.js's own CACHE constant. Duplicating that string as a literal
// here was a real bug: forgetting to bump both meant Settings could claim a
// build that didn't match what the service worker was actually serving.
// askSwVersion() below asks the running SW for it once at boot.
let SW_VERSION = "…";
function askSwVersion(){
  if(!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.ready.then(reg => reg.active?.postMessage('GET_VERSION')).catch(()=>{});
  navigator.serviceWorker.addEventListener('message', (e) => {
    if(e.data?.type === 'VERSION') SW_VERSION = e.data.version;
  });
}

/* ============================================================
   STATE
============================================================ */
function freshTargets(key){
  const {label, ...t} = PHASE_PRESETS[key];
  return t;
}
function defaultSettings(){
  return { phase:"offseason", unit:"kg", targets: freshTargets("offseason"), targetsEdited:false, aiModel: OPENAI_MODEL_DEFAULT };
}
let state = {
  tab: "dashboard",
  settings: null,
  workouts: [],
  exerciseLibrary: [],
  dietLog: [],
  foodLibrary: [],
  measurements: [],
  photos: [],       // metadata only: {id,date,pose,note,w,h} — images stream from /api/photos/:id/:variant
  programs: [],
  activeSession: null,
  steps: [],
  cardioLog: [],
  profile: null,     // {heightCm, age, sex, activityLevel, waterTargetL, waterIncrementL}
  dietPlan: null,     // {breakfast:'text', lunch:'text', ...} one per MEAL_SLOTS key
  waterLog: [],
  loaded: false,
  fuelDate: null     // non-persisted, reset each launch — set in init()
};

let draftWorkout = null;
let draftSteps = null;
let draftCardio = null;
let draftProfile = null;
let draftDietPlan = null;
let draftMeasurement = null;
let draftPhoto = null;
let draftProgram = null;
let compareIds = [null,null];
let compareFade = 50;
let expandedWorkouts = new Set();
let restIntervals = new Map();   // exUid -> intervalId
let sessionTicker = null;        // setInterval id for the live execution-mode duration display
let chartData = {};              // id -> {points, ...} cached for hover

let isStartingSession = false;   // guards a double-tap on START WORKOUT starting two sessions

const todayStr = () => new Date().toISOString().slice(0,10);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

/* ============================================================
   API CLIENT — the only place that talks to the backend. Kept
   behind loadKey()/saveKey() with their ORIGINAL signatures, so
   every existing render/save call site elsewhere in this file
   needed zero changes when storage moved server-side.
============================================================ */
const API = '/api';

async function apiGet(path){
  const r = await fetch(API+path);
  if(!r.ok) throw Object.assign(new Error('GET '+path+' failed: '+r.status), {status:r.status});
  return r.json();
}
async function apiSend(path, method, body){
  const opts = { method };
  if(body !== undefined){ opts.headers = {'Content-Type':'application/json'}; opts.body = JSON.stringify(body); }
  const r = await fetch(API+path, opts);
  const data = await r.json().catch(()=>({}));
  if(!r.ok) throw Object.assign(new Error(data.error || ('HTTP '+r.status)), {status:r.status, code:data.code});
  return data;
}

function showStorageBanner(msg){
  document.getElementById('storageBannerRoot').innerHTML = `<div class="storage-banner">⚠ ${escapeHtml(msg)}</div>`;
}

async function loadMeta(){
  try{
    const meta = await apiGet('/meta');
    EXERCISE_LIBRARY_DEFAULT = meta.exerciseLibraryDefault;
    FOOD_LIBRARY_DEFAULT = meta.foodLibraryDefault;
    PHASE_PRESETS = meta.phasePresets;
    MEAL_SLOTS = meta.mealSlots;
    return true;
  }catch(e){
    serverUnreachable = true;
    showStorageBanner("Can't reach the VISHALXFIT server. Check your connection and reload — if you're running this on your laptop, make sure start-vishal7.command is still running.");
    return false;
  }
}
// Distinguishes "still loading" (state.loaded false, briefly, on a normal
// launch) from "the server never answered" — renderApp() shows a very
// different empty state for each; the old version showed a perpetual
// "Loading your data…" in the latter case even though the small banner
// above already said what was actually wrong.
let serverUnreachable = false;

// Set when any loadKey() call fails against a server that DID answer /meta
// (loadMeta succeeded, so we know we're online) — distinguishes "this key
// genuinely has no data yet" (value === null, a normal fresh-account state)
// from "the server errored and we silently fell back", which used to render
// as an empty first-launch app with no indication anything went wrong.
let hadLoadError = false;
async function loadKey(key, fallback){
  try{
    const {value} = await apiGet('/kv/'+key);
    return value == null ? fallback : value;
  }catch(e){
    console.error('loadKey failed', key, e);
    hadLoadError = true;
    return fallback;
  }
}
async function saveKey(key, value){
  try{
    const r = await apiSend('/kv/'+key, 'PUT', {value});
    // Record our own write's revision so the poll loop below doesn't turn
    // right around and re-fetch what we just saved locally.
    if(typeof r.rev === 'number') lastSeenRev = r.rev;
    return true;
  }catch(e){
    console.error("save failed", key, e);
    showToast("Couldn't save — is the server still running?", "error");
    return false;
  }
}

async function loadAll(){
  const [settings, workouts, exerciseLibrary, dietLog, foodLibrary, measurements, photosRes, programs, sessionRes, steps, cardioLog, profile, dietPlan, waterLog] = await Promise.all([
    loadKey('settings', null),
    loadKey('workouts', []),
    loadKey('exerciseLibrary', []),
    loadKey('dietLog', []),
    loadKey('foodLibrary', []),
    loadKey('measurements', []),
    apiGet('/photos').catch(()=>({photos:[]})),
    loadKey('programs', []),
    apiGet('/session').catch(()=>({session:null})),
    loadKey('steps', []),
    loadKey('cardioLog', []),
    loadKey('profile', null),
    loadKey('dietPlan', null),
    loadKey('waterLog', [])
  ]);
  state.settings = settings || defaultSettings();
  state.workouts = workouts || [];
  state.exerciseLibrary = exerciseLibrary || [];
  state.dietLog = dietLog || [];
  state.foodLibrary = foodLibrary || [];
  state.measurements = measurements || [];
  state.photos = photosRes.photos || [];
  state.programs = programs || [];
  state.activeSession = sessionRes.session || null;
  state.steps = steps || [];
  state.cardioLog = cardioLog || [];
  state.profile = profile || null;
  state.dietPlan = dietPlan || null;
  state.waterLog = waterLog || [];
  state.fuelDate = todayStr();
  state.loaded = true;
  if(hadLoadError){
    showToast("Some data didn't load — the server answered but a request failed. Reload to retry.", "error");
    hadLoadError = false;
  }
}

/* ============================================================
   CROSS-DEVICE SYNC — cheap polling for a second device (e.g. an
   iPhone) sharing this same account. The server exposes a revision
   number (backed by a Postgres sequence, durable across restarts) that
   advances on every write; we poll that tiny endpoint on an interval and
   only pay for a full state refresh when it actually moved. Never
   refreshes while a modal is open, a draft edit is in flight, or an
   input is focused — that would silently discard whatever you're
   mid-typing.
============================================================ */
let lastSeenRev = null;
let pollTimer = null;

function pollBlocked(){
  const modalRoot = document.getElementById('modalRoot');
  if(modalRoot && modalRoot.innerHTML.trim() !== "") return true;
  const fx = document.getElementById('fxRoot');
  if(fx && fx.children.length) return true;   // START countdown / PR overlay in flight
  if(draftWorkout || draftSteps || draftCardio || draftProfile || draftDietPlan || draftMeasurement || draftPhoto || draftProgram) return true;
  const el = document.activeElement;
  if(el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return true;
  return false;
}

async function refreshFromServer(){
  const scrollY = window.scrollY;
  const fuelDate = state.fuelDate;
  await loadAll();
  state.fuelDate = fuelDate;
  renderApp();
  window.scrollTo({top: scrollY, behavior:'instant'});
}

async function pollForRemoteChanges(){
  if(document.visibilityState !== 'visible') return;
  if(pollBlocked()) return;
  let rev;
  try{
    ({rev} = await apiGet('/meta/rev'));
  }catch(e){ return; } // offline/unreachable — normal on a phone, not an error to surface here

  if(lastSeenRev === null){ lastSeenRev = rev; return; }
  if(rev === lastSeenRev) return;
  lastSeenRev = rev;
  await refreshFromServer();
}

const POLL_INTERVAL_MS = 15000;
function startPolling(){
  stopPolling();
  pollTimer = setInterval(pollForRemoteChanges, POLL_INTERVAL_MS);
}
function stopPolling(){
  if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
}
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible'){ pollForRemoteChanges(); startPolling(); }
  else stopPolling();
});
window.addEventListener('focus', pollForRemoteChanges);

/* ============================================================
   UTIL
============================================================ */
let toastTimer = null;
function showToast(msg, kind){
  clearTimeout(toastTimer);
  const root = document.getElementById('toastRoot');
  const cls = kind ? ' '+kind : '';
  root.innerHTML = `<div class="toast${cls}" role="status" aria-live="polite"><span class="dot"></span>${escapeHtml(msg)}</div>`;
  toastTimer = setTimeout(()=>{
    const t = root.querySelector('.toast');
    if(!t){ root.innerHTML=""; return; }
    t.classList.add('toast-out');
    setTimeout(()=>{ root.innerHTML=""; }, 240);
  }, 2600);
}

/* ============================================================
   RIPPLE — one delegated listener covers every button-like control
   added anywhere in the app (including ones rendered long after this
   runs), so no per-component wiring is needed as new screens are built.
============================================================ */
function initRipple(){
  const SEL = '.btn, .navbtn, .railbtn, .icon-btn, .qbtn';
  document.addEventListener('pointerdown', (e) => {
    if(e.button !== undefined && e.button !== 0) return; // left click / primary touch only
    const el = e.target.closest(SEL);
    if(!el || el.disabled) return;
    const rect = el.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height) * 1.4;
    const span = document.createElement('span');
    span.className = 'ripple';
    span.style.width = span.style.height = size+'px';
    span.style.left = (e.clientX - rect.left - size/2)+'px';
    span.style.top = (e.clientY - rect.top - size/2)+'px';
    el.appendChild(span);
    span.addEventListener('animationend', () => span.remove());
  }, {passive:true});
}
function escapeHtml(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(d){
  const dt = new Date(d + "T00:00:00");
  return dt.toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'});
}
function fmtShort(d){
  const dt = new Date(d + "T00:00:00");
  return dt.toLocaleDateString(undefined, {month:'short', day:'numeric'});
}
function dietTotals(day){
  const t = {calories:0, protein:0, carbs:0, fat:0, fiber:0};
  if(!day || !day.meals) return t;
  MEAL_SLOTS.forEach(m => (day.meals[m.key]||[]).forEach(f => {
    t.calories += Number(f.calories)||0;
    t.protein += Number(f.protein)||0;
    t.carbs += Number(f.carbs)||0;
    t.fat += Number(f.fat)||0;
    t.fiber += Number(f.fiber)||0;
  }));
  return t;
}
function allExerciseNames(){
  return [...new Set([...EXERCISE_LIBRARY_DEFAULT, ...state.exerciseLibrary])].sort();
}
function trainingStreak(){
  const dates = new Set(state.workouts.map(w=>w.date));
  let streak = 0;
  let d = new Date();
  // allow "today not logged yet" to not break a streak that continues yesterday
  if(!dates.has(todayStr())) d.setDate(d.getDate()-1);
  while(true){
    const s = d.toISOString().slice(0,10);
    if(dates.has(s)){ streak++; d.setDate(d.getDate()-1); } else break;
  }
  return streak;
}
// Longest-ever run of consecutive training days, derived read-only from
// workout history — no separate "best streak" field is stored anywhere.
function bestStreak(){
  const dates = [...new Set(state.workouts.map(w=>w.date))].sort();
  if(dates.length===0) return 0;
  let best=1, cur=1;
  for(let i=1;i<dates.length;i++){
    const diffDays = Math.round((new Date(dates[i]+'T00:00:00Z') - new Date(dates[i-1]+'T00:00:00Z'))/86400000);
    cur = diffDays===1 ? cur+1 : 1;
    if(cur>best) best = cur;
  }
  return best;
}
function getActiveProgram(){
  return state.programs.find(p=>p.active) || null;
}
// Weekday derived the same way the server's workoutProgramService does (UTC,
// from the date STRING) — see the comment there on why parsing todayStr()
// as local time and reading it back with UTC getters would silently shift
// by a day for most users.
function getTodaysProgramDay(){
  const program = getActiveProgram();
  if(!program) return null;
  const weekday = new Date(todayStr()+'T00:00:00Z').getUTCDay();
  return program.days.find(d=>d.weekday===weekday) || null;
}

/* ============================================================
   CONFIRM SHEET — replaces native confirm() everywhere
============================================================ */
function confirmSheet(message, onYes, opts){
  const o = Object.assign({yes:'Delete', danger:true}, opts||{});
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-overlay confirm-sheet" onclick="if(event.target===this) closeModal()">
      <div class="modal-sheet" role="dialog" aria-modal="true">
        <div class="display" style="font-size:18px;margin-bottom:8px;">Are you sure?</div>
        <div class="muted small">${escapeHtml(message)}</div>
        <div class="row">
          <button class="btn btn-ghost btn-block" onclick="closeModal()">Cancel</button>
          <button class="btn ${o.danger?'btn-danger':'btn-primary'} btn-block" id="confirmYesBtn">${escapeHtml(o.yes)}</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('confirmYesBtn').onclick = ()=>{ closeModal(); onYes(); };
}

/* ============================================================
   NAV — the hash reflects the current tab so a reload, a bookmark, or a
   link you share lands back on that tab instead of always defaulting to
   Dashboard (previously there was no routing at all: state.tab was
   in-memory only). replaceState, not pushState — a tab switch isn't a
   "page" worth its own back-button stop; browser back/forward is instead
   handled by the hashchange listener below, for the rare case something
   else changes the hash (or the user edits the URL directly).
============================================================ */
const VALID_TABS = ['dashboard','train','fuel','measure','photos'];
function switchTab(tab){
  state.tab = tab;
  document.querySelectorAll('.navbtn,.railbtn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  renderApp();
  window.scrollTo({top:0, behavior:'instant'});
  const hash = '#'+tab;
  if(location.hash !== hash) history.replaceState(null, '', location.pathname + location.search + hash);

window.addEventListener('hashchange', () => {

/* ============================================================
   MASTER RENDER
============================================================ */
function renderApp(){
  const app = document.getElementById('app');
  document.querySelectorAll('.navbtn,.railbtn').forEach(b => b.classList.toggle('active', b.dataset.tab === state.tab));
  if(!state.loaded){
    app.innerHTML = serverUnreachable
      ? `<div class="empty-state"><div class="display">Can't reach the server</div>Your workouts and meals are safe — this device just couldn't load them.<div><button class="btn btn-primary" onclick="location.reload()">Retry</button></div></div>`
      : `<div class="empty-state">Loading your data…</div>`;
    return;
  }
  switch(state.tab){
    case 'dashboard': app.innerHTML = renderDashboard(); loadChecklistCard(); hydratePhotoImages(); if(state.activeSession) startSessionTicker(); break;
    case 'train': app.innerHTML = renderTrain(); loadChecklistCard(); if(state.activeSession) startSessionTicker(); break;
    case 'fuel': app.innerHTML = renderFuel(); break;
    case 'measure': app.innerHTML = renderMeasure(); drawWeightChart(); break;
    case 'photos': app.innerHTML = renderPhotos(); hydratePhotoImages(); break;
  }
  // Restart the fade-in on every render, including re-renders of the same
  // tab (a save, a poll refresh) — cheap, and honors prefers-reduced-motion
  // for free via the global transition/animation-duration override above.
  app.classList.remove('fade-in');
  requestAnimationFrame(() => app.classList.add('fade-in'));
  animateFills(app);
  animateCountups(app);
}

/* ============================================================
   MOTION HELPERS — a freshly-inserted element can't CSS-transition
   from its own creation (there's no prior painted frame to animate
   from), so anything that should visibly fill/count up on render
   needs this one-time JS nudge: paint at the CSS default (width:0 /
   "0"), then on the next frame jump to the real value so the
   transition/interpolation actually has something to animate across.
============================================================ */
function animateFills(root){
  (root||document).querySelectorAll('.macrobar-fill[data-w]').forEach(el => {
    const target = el.dataset.w;
    requestAnimationFrame(() => requestAnimationFrame(() => { el.style.width = target+'%'; }));
  });
}
// key -> last rendered target, so re-rendering the same metric (a poll
// refresh, a new set logged) counts from where it actually was rather than
// always from 0 — 62g -> 124g reads as an update; 0 -> 124g reads as a reload.
let countupLast = {};
function animateCountups(root){
  const reduced = window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  (root||document).querySelectorAll('.countup[data-target]').forEach(el => {
    const raw = el.dataset.target;
    const target = parseFloat(raw);
    if(!isFinite(target)){ return; }
    const key = el.dataset.key;
    const from = (key && typeof countupLast[key] === 'number') ? countupLast[key] : 0;
    if(key) countupLast[key] = target;
    if(reduced || from === target){ el.textContent = raw; return; }
    const decimals = (raw.split('.')[1]||'').length;
    const duration = 700;
    const start = performance.now ? performance.now() : Date.now();
    function tick(now){
      const t = Math.min(1, (now-start)/duration);
      const eased = 1 - Math.pow(1-t, 3); // ease-out-cubic — no overshoot on a number readout
      const val = from + (target-from)*eased;
      el.textContent = val.toFixed(decimals);
      if(t < 1) requestAnimationFrame(tick);
      else el.textContent = raw;
    }
    requestAnimationFrame(tick);
  });
}

/* ============================================================
   DASHBOARD (hero)
============================================================ */
function sparklinePath(vals, w, h){
  if(vals.length < 2) return '';
  const min = Math.min(...vals), max = Math.max(...vals), range=(max-min)||1;
  const step = w/(vals.length-1);
  return vals.map((v,i)=>{
    const x = i*step, y = h - ((v-min)/range)*h;
    return (i===0?'M':'L')+x.toFixed(1)+','+y.toFixed(1);
  }).join(' ');
}

// Mirrors server/services/profileService.js#computeBMI exactly — kept here
// too so the modal can show a live readout without a round-trip.
function computeBMI(heightCm, weightKg){
  if(!heightCm || !weightKg) return null;
  const heightM = heightCm/100;
  const bmi = weightKg/(heightM*heightM);
  let category = bmi<18.5?'Underweight':bmi<25?'Normal':bmi<30?'Overweight':'Obese';
  return {value: Math.round(bmi*10)/10, category};
}

function renderWaterCard(){
  const targetL = state.profile?.waterTargetL || 3;
  const incrementL = state.profile?.waterIncrementL || 1;
  const boxCount = Math.max(1, Math.ceil(targetL/incrementL));
  const todayAmount = todaysWaterEntry()?.amountL || 0;
  const filled = Math.round(todayAmount/incrementL);
  const pct = targetL ? Math.min(100, Math.round(todayAmount/targetL*100)) : 0;
  const boxes = Array.from({length:boxCount}, (_,i)=>{
    const isFilled = i < filled;
    return `<button class="btn ${isFilled?'btn-primary':'btn-ghost'} btn-sm" style="flex:1;" onclick="setWaterLevel(${i})" aria-label="${isFilled?'Filled':'Empty'} ${incrementL}L">${isFilled?'✓':''}</button>`;
  }).join('');
  return `

      </div>
      <div class="row" style="gap:4px;">${boxes}</div>
    </div>
  `;
}
async function setWaterLevel(i){
  const incrementL = state.profile?.waterIncrementL || 1;
  const date = todayStr();
  const idx = state.waterLog.findIndex(w=>w.date===date);
  const currentFilled = idx>=0 ? Math.round(state.waterLog[idx].amountL/incrementL) : 0;
  // Tapping the topmost already-filled box decrements (correction path);
  // tapping any other box fills up to it.
  const newFilled = (i === currentFilled-1) ? i : i+1;
  const amountL = Math.round(newFilled*incrementL*100)/100;
  const entry = {id: idx>=0?state.waterLog[idx].id:uid(), date, amountL};
  if(idx>=0) state.waterLog[idx]=entry; else state.waterLog.push(entry);
  await saveKey('waterLog', state.waterLog);
  renderApp();
}

  const priorW = sortedMeas.filter(m => m.weight && m.date <= weekAgoStr)[0];

}
function renderMacroBar(label, val, target, unit, key){
  // Color encodes STATE (how close to target), not macro identity — the label
  // already says which macro this is, so identity-by-hue was a wasted channel.
  unit = unit || 'g';
  const pct = target ? Math.round(val/target*100) : 0;
  const shown = Math.min(100, pct);
  const over = Math.max(0, pct-100);
  const onTarget = pct>=100 && pct<=105;
  let fill = 'var(--acid-deep)';       // < 85%: quiet, work to do
  if(pct>=85 && pct<100) fill = 'var(--acid-core)';   // closing in
  if(onTarget) fill = 'var(--acid)';                   // hit it — the glow moment
  const glow = onTarget ? 'box-shadow:0 0 10px var(--acid-glow);' : '';
  // key lets the same metric (e.g. "today's protein") count from its last
  // rendered value instead of 0 even when it's re-drawn on a different
  // screen (Dashboard vs Fuel share the same key) — see animateCountups().
  const valueOut = key
    ? `<span class="countup" data-target="${Math.round(val)}" data-key="${key}">0</span>`
    : Math.round(val);
  return `
    <div class="macrobar">
      <div class="macrobar-top"><span class="muted">${label}</span><span class="mono ${pct>100?'warn-text':''}">${onTarget?'✓ ':''}${valueOut} / ${target}${unit}${pct>100?' ('+(pct-100)+'% over)':''}</span></div>
      <div class="macrobar-track">
        <div class="macrobar-fill" data-w="${shown}" style="background:${fill};${glow}"></div>
        ${over>0 ? `<div class="macrobar-over" style="left:${Math.max(0,100-over)}%;width:${Math.min(over,100)}%;"></div>` : ''}
      </div>
    </div>
  `;
}

/* ============================================================
   CHARTS — one shared drawing routine, measured viewBox,
   axes/gridlines/hover. Called post-render (two-pass) — the
   DOM has to exist before a chart can measure it.
============================================================ */
function niceStep(rough){
  const mag = Math.pow(10, Math.floor(Math.log10(rough||1)));
  const n = rough/mag;
  const step = n<1.5?1:n<3?2:n<7?5:10;
  return step*mag;
}
function niceCeil(max, ticks){
  const step = niceStep(max/(ticks-1));
  return {step, ceil: Math.ceil(max/step)*step};
}
function drawChart(containerId, opts){
  const el = document.getElementById(containerId);
  if(!el) return;
  const {points, zeroBased, unit, fmtVal, fmtX, areaFill, extraSeries} = opts;
  if(!points || points.length < 2) return; // empty message already in template
  const width = Math.max(240, el.clientWidth || 600);
  const H = window.innerWidth >= 1024 ? 220 : 180;
  const pad = {t:16, r:14, b:26, l:44};
  const vals = points.map(p=>p.y);
  let yMin, yMax;
  if(zeroBased){
    const {ceil} = niceCeil(Math.max(...vals,1), 4);
    yMin = 0; yMax = ceil;
  } else {
    const lo = Math.min(...vals), hi = Math.max(...vals);
    const range = (hi-lo)||1;
    yMin = Math.floor((lo - range*0.15)*2)/2;
    yMax = Math.ceil((hi + range*0.15)*2)/2;
  }
  const plotW = width - pad.l - pad.r, plotH = H - pad.t - pad.b;
  const xAt = i => pad.l + (points.length===1?0:i*(plotW/(points.length-1)));
  const yAt = v => pad.t + plotH - ((v-yMin)/(yMax-yMin||1))*plotH;

  const pts = points.map((p,i)=>[xAt(i), yAt(p.y)]);
  const path = pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');

  let gridSvg = '';
  const ticks = 4;
  for(let i=0;i<=ticks;i++){
    const v = yMin + (yMax-yMin)*(i/ticks);
    const y = yAt(v);
    gridSvg += `<line x1="${pad.l}" y1="${y.toFixed(1)}" x2="${width-pad.r}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`;
    gridSvg += `<text x="${pad.l-8}" y="${(y+3).toFixed(1)}" text-anchor="end" class="mono" font-size="10" fill="var(--ink-3)">${fmtVal(v)}</text>`;
  }

  let areaSvg = '';
  if(areaFill){
    const gid = containerId+'-grad';
    const base = yAt(Math.max(yMin,0));
    const areaPath = path + ` L${pts[pts.length-1][0].toFixed(1)},${base.toFixed(1)} L${pts[0][0].toFixed(1)},${base.toFixed(1)} Z`;
    areaSvg = `<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--acid)" stop-opacity="0.28"/>
        <stop offset="100%" stop-color="var(--acid)" stop-opacity="0"/>
      </linearGradient></defs>
      <path d="${areaPath}" fill="url(#${gid})"/>`;
  }

  let extraSvg = '';
  if(extraSeries){
    const epts = extraSeries.map((v,i)=>[xAt(i), yAt(v)]);
    const epath = epts.filter(p=>!isNaN(p[1])).map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
    extraSvg = `<path d="${epath}" fill="none" stroke="var(--ink-3)" stroke-width="1.5" stroke-dasharray="4 3"/>`;
  }

  const dotsSvg = pts.map((p,i)=> i===pts.length-1
    ? `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="5" fill="var(--acid)" stroke="var(--surface)" stroke-width="2"/>`
    : `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="var(--acid)" stroke="var(--surface)" stroke-width="2"/>`
  ).join('');

  const xLabels = [];
  const showEvery = window.innerWidth >= 1024 ? Math.max(1, Math.ceil(points.length/8)) : Math.max(1, points.length-1);
  const idxs = window.innerWidth >= 1024 ? points.map((_,i)=>i).filter(i=>i%showEvery===0) : [0, points.length-1];
  [...new Set(idxs)].forEach(i=>{
    xLabels.push(`<text x="${xAt(i).toFixed(1)}" y="${H-6}" text-anchor="${i===0?'start':(i===points.length-1?'end':'middle')}" class="mono" font-size="10" fill="var(--ink-3)">${fmtX(points[i].x)}</text>`);
  });

  const endLabel = `<text x="${pts[pts.length-1][0].toFixed(1)}" y="${(pts[pts.length-1][1]-10).toFixed(1)}" text-anchor="end" class="mono" font-size="11" fill="var(--chalk)" font-weight="700">${fmtVal(points[points.length-1].y)}${unit||''}</text>`;

  chartData[containerId] = {points, xAt, yAt, fmtVal, fmtX, unit};

  el.innerHTML = `
    <svg viewBox="0 0 ${width} ${H}" width="${width}" height="${H}" role="img" aria-label="${escapeHtml((opts.ariaLabel||'chart'))}"
      onpointermove="chartHover(event,'${containerId}')" onpointerleave="chartOut('${containerId}')">
      <title>${escapeHtml(opts.ariaLabel||'')}</title>
      ${gridSvg}
      ${areaSvg}
      ${extraSvg}
      <path id="${containerId}-line" d="${path}" fill="none" stroke="var(--acid)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${dotsSvg}
      ${endLabel}
      ${xLabels.join('')}
      <line id="${containerId}-cross" x1="0" y1="${pad.t}" x2="0" y2="${H-pad.b}" stroke="var(--ink-3)" stroke-width="1" style="display:none;"/>
    </svg>
    <div class="chart-tooltip" id="${containerId}-tip"></div>
  `;
  // Draw the line on rather than have it just appear — real CSS transition
  // (not a JS rAF loop), so it already honors prefers-reduced-motion via the
  // global transition-duration override, no extra check needed here.
  const lineEl = document.getElementById(containerId+'-line');
  if(lineEl && lineEl.getTotalLength){
    const len = lineEl.getTotalLength();
    lineEl.style.strokeDasharray = len;
    lineEl.style.strokeDashoffset = len;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      lineEl.style.transition = 'stroke-dashoffset 1s var(--ease-out)';
      lineEl.style.strokeDashoffset = '0';
    }));
  }
}
let chartResizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(chartResizeTimer);
  chartResizeTimer = setTimeout(() => {
    // Charts are sized once from clientWidth with no resize handling today —
    // an iPhone rotation (or the desktop rail toggling in/out) leaves them
    // mis-sized until the next full render. Re-run whichever tab is open.
    if(state.tab === 'measure') drawWeightChart();
  }, 150);
});
function chartHover(evt, id){
  const d = chartData[id];
  if(!d) return;
  const svg = evt.currentTarget;
  const rect = svg.getBoundingClientRect();
  const scaleX = svg.viewBox.baseVal.width / rect.width;
  const localX = (evt.clientX - rect.left) * scaleX;
  let nearest = 0, best = Infinity;
  d.points.forEach((p,i)=>{ const dx = Math.abs(d.xAt(i)-localX); if(dx<best){best=dx;nearest=i;} });
  const cross = document.getElementById(id+'-cross');
  const tip = document.getElementById(id+'-tip');
  if(cross){ cross.style.display='block'; cross.setAttribute('x1', d.xAt(nearest)); cross.setAttribute('x2', d.xAt(nearest)); }
  if(tip){
    tip.style.display='block';
    tip.style.left = ((d.xAt(nearest)/svg.viewBox.baseVal.width)*rect.width)+'px';
    tip.style.top = ((d.yAt(d.points[nearest].y)/svg.viewBox.baseVal.height)*rect.height)+'px';
    tip.textContent = `${d.fmtX(d.points[nearest].x)} · ${d.fmtVal(d.points[nearest].y)}${d.unit||''}`;
  }
}
function chartOut(id){
  const cross = document.getElementById(id+'-cross');
  const tip = document.getElementById(id+'-tip');
  if(cross) cross.style.display='none';
  if(tip) tip.style.display='none';
}
function movingAvg(vals, window){
  return vals.map((_,i)=>{
    const start = Math.max(0,i-window+1);
    const slice = vals.slice(start,i+1);
    return slice.reduce((a,b)=>a+b,0)/slice.length;
  });
}
function drawWeightChart(){
  const list = [...state.measurements].filter(m=>m.weight).sort((a,b)=> a.date<b.date?-1:1).slice(-20);

function startRestTimer(exUid, seconds){
  const ex = findEx(exUid);

  stopRestTimer(exUid);
  ex.restTotal = seconds;
  ex.restSecLeft = seconds;

  const iv = setInterval(()=>{

    const txt = document.getElementById(`rest-txt-${exUid}`);
    if(circle){
      const pct = Math.max(0, 1 - ex.restSecLeft/ex.restTotal);
      circle.style.strokeDashoffset = (REST_RING_C * (1-pct)).toFixed(1);
    }
    if(txt) txt.innerHTML = ex.restSecLeft > 0 ? `<b>${ex.restSecLeft}s</b>` : `<b>Stretch 10–15s</b>`;

function renderExerciseBlock(ex){
  return `

function renderGauge7(ex){
  const filled = ex.sets.filter(s => s.weight!=="" && s.reps!=="").length;
  const activeIdx = filled<7 ? filled : -1;
  const segs = Array.from({length:7}, (_,k)=>{
    const isFilled = k < filled;
    const isActive = k === activeIdx;
    const color = isFilled ? `background:${lerpAcid(k/6)};` : '';
    return `<div class="seg ${isFilled?'filled':''} ${isActive?'pulse':''}"><div class="fill" style="${color}"></div></div>`;
  }).join('');
  const running = ex.restSecLeft > 0 || ex.restTotal > 0;
  const pct = ex.restTotal ? Math.max(0, 1 - ex.restSecLeft/ex.restTotal) : 0;
  const restRow = running ? `
    <div class="rest-timer">
      <svg class="ring" viewBox="0 0 36 36">
        <circle cx="18" cy="18" r="${REST_RING_R}" fill="none" stroke="var(--surface)" stroke-width="3"/>
        <circle id="rest-ring-c-${ex.uid}" cx="18" cy="18" r="${REST_RING_R}" fill="none" stroke="var(--acid)" stroke-width="3"
          stroke-linecap="round" stroke-dasharray="${REST_RING_C.toFixed(1)}" stroke-dashoffset="${(REST_RING_C*(1-pct)).toFixed(1)}"
          transform="rotate(-90 18 18)"/>
      </svg>
      <div class="txt" id="rest-txt-${ex.uid}">${ex.restSecLeft>0 ? `<b>${ex.restSecLeft}s</b> rest` : '<b>Stretch 10–15s</b>'}</div>
    </div>` : '';
  return `
    <div class="gauge7-panel" id="gaugePanel-${ex.uid}">
      <div class="gauge7">${segs}</div>
      <div class="small muted">${filled}/7 sets · keep rest to 25–35s, hold a deep stretch after the last set</div>
      <button type="button" class="btn btn-ghost btn-sm" style="margin-top:8px;" onclick="startRestTimer('${ex.uid}', 30)">Start 30s Rest</button>
      ${restRow}
    </div>
  `;
}
async function saveWorkout(){
  if(draftWorkout.exercises.length === 0 || draftWorkout.exercises.every(e=>!e.name)){
    showToast("Add at least one exercise");
    return;

  stopAllRestTimers();
  const clean = {
    id: uid(),
    date: draftWorkout.date,
    split: draftWorkout.split || "Workout",
    exercises: draftWorkout.exercises
      .filter(e => e.name)
      .map(e => ({ uid:e.uid, name:e.name, isFst7:e.isFst7, sets:e.sets.filter(s=>s.weight!=="" || s.reps!=="") }))
  };
  state.workouts.push(clean);
  clean.exercises.forEach(e=>{
    if(!EXERCISE_LIBRARY_DEFAULT.includes(e.name) && !state.exerciseLibrary.includes(e.name)){
