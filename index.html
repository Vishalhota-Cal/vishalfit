<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VISHALXFIT — Train. Fuel. Peak.</title>
<meta name="theme-color" content="#0A0B0D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VISHALXFIT">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
/* Anton + JetBrains Mono are SIL Open Font License 1.1 — bundling permitted, including in a paid product. */
@font-face{
  font-family:'Anton'; font-style:normal; font-weight:400; font-display:swap;
  src:url('fonts/Anton-Regular.ttf') format('truetype');
}
@font-face{
  font-family:'JetBrains Mono'; font-style:normal; font-weight:500; font-display:swap;
  src:url('fonts/JetBrainsMono-Medium.ttf') format('truetype');
}

:root{
  /* ---- ground: near-black, not pure #000 (halates against acid on OLED) ---- */
  --ink:#0A0B0C;
  --ink-void:#000000;        /* reserved for the lightbox + boot curtain only */
  --sunken:#050506;          /* input wells, progress tracks, chart plot floor */
  --surface:#101215;
  --surface-raised:#16181A;
  --surface-hover:#1C2024;

  /* ---- the accent, rationed in three strengths ---- */
  --acid:#CCFF00;            /* signature — hero numeral, active nav, primary fill, gauge set 7, chart's last point */
  --acid-core:#B8E600;       /* workhorse — chart strokes, icons, accent text, "on target" */
  --acid-deep:#8FA800;       /* structural — dim/quiet state, area-fill stop, hover borders */
  --acid-wash:rgba(204,255,0,0.10);
  --acid-glow:rgba(204,255,0,0.28);

  --chalk:#F2F3F0;
  --ink-2:#9DA2A8;           /* secondary text, micro-labels — 7.3:1 */
  --ink-3:#6E747C;           /* tertiary + placeholders — was 2.22:1, now passes */

  --warn:#FFB020;            /* over-target */
  --danger:#D42A24;          /* destructive FILLS — white text on it passes AA */
  --danger-ink:#FF7A70;      /* destructive TEXT on dark */
  --danger-soft:rgba(212,42,36,0.14);

  /* borders carry elevation here — fills can't, surfaces sit too close to --ink to separate on their own */
  --line:rgba(242,243,240,0.08);
  --line-strong:rgba(242,243,240,0.16);
  --line-acid:rgba(204,255,0,0.32);
  --sheen:inset 0 1px 0 rgba(255,255,255,0.05);

  /* type scale: 7 sizes, not 15 */
  --fs-micro:11px; --fs-xs:12px; --fs-sm:13px; --fs-base:15px;
  --fs-input:16px; --fs-lg:17px;
  --fs-d3:15px; --fs-d2:22px; --fs-d1:clamp(28px,6vw,40px); --fs-hero:clamp(56px,17vw,88px);

  /* spacing, 4px base */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;

  /* radius — concentric: sm inside md inside lg */
  --r-sm:10px; --r-md:14px; --r-lg:20px;

  /* elevation — three steps, then stop. e2/e3 lean on border brightness, not fill. */
  --e1:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -12px rgba(0,0,0,.7);
  --e2:0 24px 60px -20px rgba(0,0,0,.85);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--ink);
  color:var(--chalk);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI Variable Text','Segoe UI',Roboto,system-ui,sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  padding-bottom:76px;
  font-size:var(--fs-base);
}
::selection{background:var(--acid-soft);color:var(--chalk);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--surface-raised);border-radius:8px;}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
:focus-visible{outline:2px solid var(--acid);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){ *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;} }

.mono{font-family:'JetBrains Mono',ui-monospace,'SF Mono','Cascadia Mono','Roboto Mono',Menlo,Consolas,monospace; font-variant-numeric:tabular-nums;}
.display{font-family:'Anton','Arial Narrow',Impact,system-ui,sans-serif;font-weight:400;letter-spacing:0.02em;}

/* vertical rhythm — replaces ad-hoc inline spacers. Also applied inside the
   .fuel-narrow/.measure-narrow wrappers: those use display:contents so they
   don't affect desktop width, but that ALSO makes their children invisible
   to the `#app > * + *` selector (contents removes the box, not the DOM
   parent-child relationship the selector matches on) — without this second
   rule, cards inside them render with zero gap between them. */
#app > * + *{ margin-top:var(--s4); }
.fuel-narrow > * + *, .measure-narrow > * + *{ margin-top:var(--s4); }

/* ---------- SHELL (mobile: invisible; desktop: sidebar rail) ---------- */
.shell, .main{ display:contents; }
.rail{ display:none; }

/* ---------- HEADER ---------- */
.topbar{
  position:sticky;top:0;z-index:20;
  background:linear-gradient(180deg, var(--ink) 60%, rgba(10,11,13,0.92));
  backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);
  padding:calc(14px + env(safe-area-inset-top)) 18px 12px;
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;
}
.brand{display:flex;align-items:center;gap:10px;}
.brand-text .display{font-size:20px;line-height:1;color:var(--chalk);}
.brand-text .tag{font-size:var(--fs-micro);color:var(--ink-2);letter-spacing:0.14em;text-transform:uppercase;margin-top:2px;}
.topbar-actions{display:flex;align-items:center;gap:6px;}
.topbar-clockbar{
  display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  padding:8px 18px;border-bottom:1px solid var(--line);background:var(--ink);
}
.topbar-clockbar .greeting{font-family:'Anton','Arial Narrow',Impact,sans-serif;font-size:15px;color:var(--chalk);letter-spacing:0.01em;}
.topbar-clockbar .clock{font-size:var(--fs-xs);color:var(--ink-2);white-space:nowrap;}
.phase-badge{
  padding:7px 13px;border-radius:20px;font-size:var(--fs-micro);font-weight:700;
  letter-spacing:0.09em;text-transform:uppercase;border:1px solid var(--line);
  background:var(--surface);cursor:pointer;user-select:none;
  transition:transform .15s ease;
}
.phase-badge:active{transform:scale(0.96);}
.phase-offseason{color:var(--acid);border-color:rgba(204,255,0,0.35);}
.phase-prep{color:var(--chalk);border-color:var(--line-strong);}
.phase-peak{color:#FF8A8A;border-color:rgba(255,77,77,0.4);background:var(--danger-soft);}

/* ---------- NAV ---------- */
.navbar{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  display:flex;background:var(--surface);border-top:1px solid var(--line);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom));
}
.navbtn{
  flex:1;background:none;border:none;color:var(--ink-2);
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:8px 2px;border-radius:10px;font-size:var(--fs-micro);font-weight:600;
  letter-spacing:0.04em;text-transform:uppercase;transition:.15s;
  min-height:44px;justify-content:center;
}
.navbtn svg{width:20px;height:20px;}
.navbtn.active{color:var(--acid);background:var(--acid-soft);}
.navbtn:hover{color:var(--chalk);}

/* ---------- LAYOUT ---------- */
.wrap{max-width:640px;margin:0 auto;padding:var(--s4) var(--s4) var(--s6);}
.section-row{display:flex;align-items:center;justify-content:space-between;margin:4px 0 var(--s4);}
.section-title{
  font-family:'Anton','Arial Narrow',Impact,system-ui,sans-serif;font-size:var(--fs-d2);letter-spacing:0.01em;
  color:var(--chalk); margin:0;
}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  padding:var(--s4); box-shadow:var(--sheen);
}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s3);gap:8px;}
.card-head h3{margin:0;font-size:var(--fs-micro);text-transform:uppercase;letter-spacing:0.09em;color:var(--ink-2);font-weight:700;}
.card-head h3.accent{color:var(--acid);}
.row{display:flex;gap:10px;}
.row > *{flex:1;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}

label{display:block;font-size:var(--fs-micro);color:var(--ink-2);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:5px;font-weight:600;}
input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{
  width:100%;background:var(--surface-raised);border:1px solid var(--line-strong);
  color:var(--chalk);padding:10px 11px;border-radius:var(--r-sm);font-size:var(--fs-input);
}
input::placeholder{color:var(--ink-3);}
textarea{resize:vertical;min-height:56px;}
.field{margin-bottom:var(--s3);}

.btn{
  border:none;border-radius:var(--r-sm);padding:11px 16px;font-weight:700;font-size:var(--fs-sm);
  letter-spacing:0.03em;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  transition:transform .12s ease, opacity .12s ease;
  min-height:44px;
}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--acid);color:#0A0B0C;font-weight:800;box-shadow:0 0 0 1px rgba(204,255,0,0.5),0 6px 20px -8px var(--acid-glow);}
.btn-danger{background:var(--danger);color:#1a0505;}
.btn-ghost{background:var(--surface-raised);color:var(--chalk);border:1px solid var(--line-strong);}
.btn-ghost.accent{background:transparent;color:var(--acid-core);border:1px solid var(--line-acid);}
.btn-ghost.accent:hover{background:var(--acid-wash);border-color:var(--acid-deep);}
.btn-block{width:100%;}
.btn-sm{padding:7px 11px;font-size:var(--fs-xs);border-radius:8px;min-height:36px;}
.icon-btn{
  background:none;border:none;color:var(--ink-2);padding:6px;border-radius:8px;
  min-width:40px;min-height:40px;display:inline-flex;align-items:center;justify-content:center;
}
.icon-btn:hover{color:var(--chalk);background:var(--surface-raised);}
.icon-btn svg{width:18px;height:18px;}

.muted{color:var(--ink-2);}
.warn-text{color:var(--warn);}
.small{font-size:var(--fs-xs);}
.divider{height:1px;background:var(--line);margin:var(--s4) 0;}
.tag-pill{
  font-size:var(--fs-micro);font-weight:700;text-transform:uppercase;letter-spacing:0.06em;
  padding:3px 8px;border-radius:20px;background:var(--surface-raised);color:var(--ink-2);
  display:inline-block;
}
.tag-fst{background:var(--acid-soft);color:var(--acid);}
.datum{display:inline-flex;flex-direction:column;gap:2px;margin:0 var(--s3) var(--s2) 0;}
.datum .v{font-family:ui-monospace,'SF Mono',monospace;font-size:var(--fs-sm);color:var(--chalk);}
.datum .l{font-size:var(--fs-micro);color:var(--ink-2);text-transform:uppercase;letter-spacing:0.06em;}
.empty-state{
  text-align:center;padding:var(--s7) var(--s4);color:var(--ink-2);
}
.empty-state .display{font-size:19px;color:var(--chalk);margin-bottom:6px;}
.empty-state .btn{margin-top:var(--s4);}

/* ---------- DASHBOARD (hero) ---------- */
.dash{display:grid;gap:var(--s4);grid-template-columns:1fr;}
/* hero: the one big screenshot-worthy number. One accent glow lives here — nowhere else. */
.hero{
  position:relative;overflow:hidden;padding:var(--s5) var(--s4);
  border:1px solid var(--line-acid);
  background:radial-gradient(120% 140% at 0% 0%, rgba(204,255,0,0.07), transparent 60%), var(--surface);
  box-shadow:var(--sheen), 0 24px 60px -28px rgba(204,255,0,0.18);
}
.hero-label{font-size:var(--fs-micro);letter-spacing:0.1em;color:var(--ink-2);text-transform:uppercase;}
.hero-value{
  font-family:'Anton','Arial Narrow',Impact,sans-serif;font-size:var(--fs-hero);line-height:0.86;color:var(--acid);
  text-shadow:0 0 28px rgba(204,255,0,0.30); margin-top:6px; position:relative; z-index:1;
}
.hero-unit{font-size:14px;color:var(--ink-2);margin-left:8px;text-transform:lowercase;}
.hero-sub{font-size:var(--fs-sm);color:var(--acid-core);margin-top:6px;position:relative;z-index:1;}
.hero-empty{font-size:var(--fs-sm);color:var(--ink-2);margin-top:14px;max-width:36ch;position:relative;z-index:1;}
.hero-spark{position:absolute;right:0;bottom:0;width:56%;height:52%;pointer-events:none;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.stat-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:var(--s3);
  box-shadow:var(--sheen);
}
.stat-card .label{font-size:var(--fs-micro);text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-2);font-weight:700;margin-bottom:6px;}
.stat-card .value{font-family:'Anton','Arial Narrow',Impact,sans-serif;font-size:var(--fs-d1);color:var(--chalk);line-height:1;}
.stat-card .value.accent{color:var(--acid);}
.stat-card .sub{font-size:var(--fs-xs);color:var(--ink-2);margin-top:4px;}
.stat-card .sub.up{color:var(--acid-core);}
.stat-card .spark{margin-top:6px;height:22px;}
.quickgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.qbtn{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
  padding:16px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;
  color:var(--chalk);text-align:left; box-shadow:var(--sheen); min-height:44px;
}
.qbtn svg{width:22px;height:22px;color:var(--acid);}
.qbtn .qlabel{font-weight:700;font-size:var(--fs-sm);}

/* macro bars */
.macrobar{margin-bottom:10px;}
.macrobar-top{display:flex;justify-content:space-between;font-size:var(--fs-xs);margin-bottom:5px;}
.macrobar-track{height:8px;border-radius:8px;background:var(--surface-raised);overflow:hidden;position:relative;}
.macrobar-fill{height:100%;border-radius:8px;position:absolute;left:0;top:0;}
.macrobar-over{height:100%;border-radius:8px;position:absolute;top:0;background:var(--warn);opacity:0.85;}

/* ---------- 7 GAUGE (signature): vertical staves, ordinal ramp ---------- */
.gauge7-panel{background:var(--surface-raised);border:1px solid var(--line-strong);border-radius:var(--r-md);padding:var(--s3);}
.gauge7{display:flex;gap:5px;align-items:flex-end;height:56px;margin:6px 0 8px;}
.gauge7 .seg{
  flex:1;height:100%;border-radius:5px;background:var(--surface);
  border:1px solid var(--line-strong);position:relative;overflow:visible;
  display:flex;align-items:flex-end;
}
.gauge7 .seg .fill{
  width:100%;border-radius:4px;height:0%;transition:height .25s ease;
}
.gauge7 .seg.filled .fill{height:100%;}
.gauge7 .seg.pulse .fill{animation:pulse7 1.1s ease-in-out infinite;}
@keyframes pulse7{
  0%,100%{filter:drop-shadow(0 0 0 rgba(204,255,0,0));}
  50%{filter:drop-shadow(0 0 6px rgba(204,255,0,0.75));}
}
.rest-timer{
  display:flex;align-items:center;gap:12px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;margin-top:8px;
}
.rest-timer .ring{width:36px;height:36px;flex-shrink:0;}
.rest-timer .ring circle{transition:stroke-dashoffset .95s linear;}
.rest-timer .txt{font-size:var(--fs-xs);color:var(--ink-2);}
.rest-timer .txt b{color:var(--chalk);}

/* boot curtain */
#boot{
  position:fixed;inset:0;background:var(--ink);z-index:500;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
}
#boot .gauge7{width:140px;height:44px;}
#boot .display{font-size:22px;letter-spacing:0.06em;color:var(--chalk);}
#boot .tag{font-size:var(--fs-micro);color:var(--ink-2);letter-spacing:0.16em;text-transform:uppercase;}

/* ---------- exercise / set rows ---------- */
.exercise-block{background:var(--surface-raised);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:var(--s3);}
.exercise-block-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;}
.exercise-name-input{flex:1;}
.set-row{display:grid;grid-template-columns:28px 1fr 1fr auto;gap:8px;align-items:center;margin-bottom:6px;}
.set-row .idx{font-family:ui-monospace,monospace;font-size:var(--fs-xs);color:var(--ink-2);text-align:center;}
.set-row input{padding:8px 9px;font-size:var(--fs-input);}
.chk-wrap{display:flex;align-items:center;gap:7px;font-size:var(--fs-xs);color:var(--ink-2);user-select:none;}
.chk-wrap input{width:auto;accent-color:var(--acid);}

/* ---------- history list ---------- */
.hist-item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:13px 14px;box-shadow:var(--sheen);}
.hist-top{display:flex;justify-content:space-between;align-items:flex-start;background:none;border:none;width:100%;color:inherit;text-align:left;padding:0;min-height:0;}
.hist-date{font-family:ui-monospace,monospace;font-size:var(--fs-xs);color:var(--ink-2);}
.hist-title{font-weight:700;font-size:var(--fs-lg);margin-top:2px;}
.hist-body{margin-top:10px;font-size:var(--fs-xs);color:var(--ink-2);}
.hist-body div{margin-bottom:3px;}
.hist-body b{color:var(--chalk);}
.hist-actions{display:flex;gap:6px;margin-top:8px;}

/* ---------- modal ---------- */
.modal-overlay{
  position:fixed;inset:0;background:rgba(4,4,5,0.72);z-index:100;
  display:flex;align-items:flex-end;justify-content:center;
}
.modal-sheet{
  background:var(--ink);border-top-left-radius:var(--r-lg);border-top-right-radius:var(--r-lg);
  width:100%;max-width:640px;max-height:88vh;overflow-y:auto;
  padding:var(--s4) var(--s4) calc(20px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line-strong);
  box-shadow:var(--e2);
  animation:slideUp .22s ease;
}
@keyframes slideUp{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
@keyframes zoomIn{from{transform:scale(0.97);opacity:0;}to{transform:scale(1);opacity:1;}}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--s4);}
.modal-head h2{font-family:'Anton','Arial Narrow',sans-serif;font-size:21px;margin:0;font-weight:400;}
.confirm-sheet .modal-sheet{max-width:400px;text-align:center;}
.confirm-sheet .row{margin-top:var(--s4);}

/* ---------- chart ---------- */
.chartwrap{width:100%;position:relative;}
.chartwrap svg{width:100%;height:auto;display:block;touch-action:pan-y;}
.chart-tooltip{
  position:absolute;pointer-events:none;background:var(--surface-raised);border:1px solid var(--line-strong);
  border-radius:8px;padding:6px 9px;font-size:var(--fs-xs);box-shadow:var(--e1);white-space:nowrap;
  transform:translate(-50%,-115%);display:none;z-index:5;
}
.spark-svg{width:100%;height:100%;display:block;}

/* photos */
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.photo-thumb{position:relative;border-radius:var(--r-sm);overflow:hidden;aspect-ratio:3/4;background:var(--surface-raised);border:1px solid var(--line);padding:0;}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.photo-thumb .cap{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(0deg, rgba(0,0,0,0.75), transparent);padding:5px 6px 4px;font-size:9.5px;color:var(--chalk);}
.pose-pill{position:absolute;top:5px;left:5px;font-size:8.5px;font-weight:700;text-transform:uppercase;background:rgba(0,0,0,0.55);padding:2px 6px;border-radius:20px;}
.lightbox{position:fixed;inset:0;background:rgba(5,5,6,0.94);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;}
.lightbox img{max-width:100%;max-height:76vh;border-radius:var(--r-sm);object-fit:contain;}

.upload-drop{
  border:1.5px dashed var(--line-strong);border-radius:var(--r-sm);padding:24px 12px;text-align:center;
  color:var(--ink-2);font-size:var(--fs-sm);cursor:pointer;background:none;width:100%;
}
.upload-drop:hover, .upload-drop.dragover{border-color:var(--acid);color:var(--chalk);background:var(--acid-soft);}

.compare-select{display:flex;gap:8px;margin-bottom:var(--s3);}
.compare-view{position:relative;border-radius:var(--r-sm);overflow:hidden;aspect-ratio:3/4;background:var(--surface-raised);touch-action:none;}
.compare-view img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;}
.compare-view img.top{opacity:1;transition:opacity .05s linear;}
.compare-head{display:flex;justify-content:space-between;font-size:var(--fs-xs);color:var(--ink-2);margin-bottom:6px;}
.compare-hint{text-align:center;font-size:var(--fs-micro);color:var(--ink-2);margin-top:6px;text-transform:uppercase;letter-spacing:0.06em;}

.toast{
  position:fixed;bottom:86px;left:50%;transform:translateX(-50%);
  background:var(--surface-raised);border:1px solid var(--line-strong);color:var(--chalk);
  padding:10px 18px;border-radius:20px;font-size:var(--fs-sm);z-index:150;

<script>
/* ============================================================
   BRAND MARK — the seven-staves motif, reused everywhere:
   app icon, topbar mark, boot curtain, FST-7 gauge.
============================================================ */
function sevenStavesSvg(opts){
  const o = Object.assign({bars:7, gap:1, filled:7, activeIdx:-1, rounded:true}, opts||{});
  const n = o.bars;
  const w = 100, h = 100;
  const gap = o.gap;
  const barW = (w - gap*(n-1)) / n;
  let out = `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">`;
  for(let i=0;i<n;i++){
    const t = i/(n-1);
    const barH = h * (0.28 + 0.72 * Math.pow((i+1)/n, 1.3));
    const x = i*(barW+gap);
    const y = h - barH;
    const filled = i < o.filled;
    const active = i === o.activeIdx;
    const color = filled ? lerpAcid(t) : 'var(--surface-raised)';
    out += `<rect x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${barW.toFixed(2)}" height="${barH.toFixed(2)}" rx="2" fill="${color}" ${active?'class="stave-active"':''}/>`;
  }
  out += `</svg>`;
  return out;
}
// Validated 7-step acid ordinal ramp for the FST-7 gauge: lightness-monotone,
// every adjacent step >=0.06 delta-L apart (individually distinguishable),
// dark end still clears its track. Set 7 lands on full-strength --acid —
// the brightest pixel in the app appears exactly when the burnout set finishes.
const ACID_RAMP_7 = ['#4A5A16','#5E721B','#738A20','#89A425','#A0BE2A','#B6D92F','#CCFF00'];
function lerpAcid(t){
  const idx = Math.round(t * (ACID_RAMP_7.length-1));
  return ACID_RAMP_7[Math.max(0, Math.min(ACID_RAMP_7.length-1, idx))];
}

/* ============================================================
   DATA + CONSTANTS — fetched once at boot from GET /api/meta
   (the server's referenceData.js owns these now; see Architecture
   decision in the plan for why this moved out of the client).
============================================================ */
let EXERCISE_LIBRARY_DEFAULT = [];
let FOOD_LIBRARY_DEFAULT = [];
let PHASE_PRESETS = {};
let MEAL_SLOTS = [];

const OPENAI_MODEL_DEFAULT = "gpt-4o-mini";
const SW_VERSION = "vx-2026-08-05-6";

/* ============================================================
   STATE
============================================================ */
function freshTargets(key){
  const {label, ...t} = PHASE_PRESETS[key];
  return t;
}
function defaultSettings(){
  return { phase:"offseason", unit:"kg", targets: freshTargets("offseason"), targetsEdited:false, aiModel: OPENAI_MODEL_DEFAULT };
}
let state = {
  tab: "dashboard",
  settings: null,
  workouts: [],
  exerciseLibrary: [],
  dietLog: [],
  foodLibrary: [],
  measurements: [],
  photos: [],       // metadata only: {id,date,pose,note,w,h} — images stream from /api/photos/:id/:variant
  programs: [],
  activeSession: null,
  steps: [],
  cardioLog: [],
  profile: null,     // {heightCm, age, sex, activityLevel, waterTargetL, waterIncrementL}
  dietPlan: null,     // {breakfast:'text', lunch:'text', ...} one per MEAL_SLOTS key
  waterLog: [],
  loaded: false,
  fuelDate: null     // non-persisted, reset each launch — set in init()
};

let draftWorkout = null;
let draftSteps = null;
let draftCardio = null;
let draftProfile = null;
let draftDietPlan = null;
let draftMeasurement = null;
let draftPhoto = null;
let draftProgram = null;
let compareIds = [null,null];
let compareFade = 50;
let expandedWorkouts = new Set();
let restIntervals = new Map();   // exUid -> intervalId
let sessionTicker = null;        // setInterval id for the live execution-mode duration display
let chartData = {};              // id -> {points, ...} cached for hover

const todayStr = () => new Date().toISOString().slice(0,10);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

/* ============================================================
   API CLIENT — the only place that talks to the backend. Kept
   behind loadKey()/saveKey() with their ORIGINAL signatures, so
   every existing render/save call site elsewhere in this file
   needed zero changes when storage moved server-side.
============================================================ */
const API = '/api';

async function apiGet(path){
  const r = await fetch(API+path);
  if(!r.ok) throw Object.assign(new Error('GET '+path+' failed: '+r.status), {status:r.status});
  return r.json();
}
async function apiSend(path, method, body){
  const opts = { method };
  if(body !== undefined){ opts.headers = {'Content-Type':'application/json'}; opts.body = JSON.stringify(body); }
  const r = await fetch(API+path, opts);
  const data = await r.json().catch(()=>({}));
  if(!r.ok) throw Object.assign(new Error(data.error || ('HTTP '+r.status)), {status:r.status, code:data.code});
  return data;
}

function showStorageBanner(msg){
  document.getElementById('storageBannerRoot').innerHTML = `<div class="storage-banner">⚠ ${escapeHtml(msg)}</div>`;
}

async function loadMeta(){
  try{
    const meta = await apiGet('/meta');
    EXERCISE_LIBRARY_DEFAULT = meta.exerciseLibraryDefault;
    FOOD_LIBRARY_DEFAULT = meta.foodLibraryDefault;
    PHASE_PRESETS = meta.phasePresets;
    MEAL_SLOTS = meta.mealSlots;
    return true;
  }catch(e){
    showStorageBanner("Can't reach the VISHALXFIT server. Run start-vishal7.command, then reload this page.");
    return false;
  }
}

async function loadKey(key, fallback){
  try{
    const {value} = await apiGet('/kv/'+key);
    return value == null ? fallback : value;
  }catch(e){ return fallback; }
}
async function saveKey(key, value){
  try{
    const r = await apiSend('/kv/'+key, 'PUT', {value});
    // Record our own write's revision so the poll loop below doesn't turn
    // right around and re-fetch what we just saved locally.
    if(typeof r.rev === 'number') lastSeenRev = r.rev;
    return true;
  }catch(e){
    console.error("save failed", key, e);
    showToast("Couldn't save — is the server still running?", "error");
    return false;
  }
}

async function loadAll(){
  const [settings, workouts, exerciseLibrary, dietLog, foodLibrary, measurements, photosRes, programs, sessionRes, steps, cardioLog, profile, dietPlan, waterLog] = await Promise.all([
    loadKey('settings', null),
    loadKey('workouts', []),
    loadKey('exerciseLibrary', []),
    loadKey('dietLog', []),
    loadKey('foodLibrary', []),
    loadKey('measurements', []),
    apiGet('/photos').catch(()=>({photos:[]})),
    loadKey('programs', []),
    apiGet('/session').catch(()=>({session:null})),
    loadKey('steps', []),
    loadKey('cardioLog', []),
    loadKey('profile', null),
    loadKey('dietPlan', null),
    loadKey('waterLog', [])
  ]);
  state.settings = settings || defaultSettings();
  state.workouts = workouts || [];
  state.exerciseLibrary = exerciseLibrary || [];
  state.dietLog = dietLog || [];
  state.foodLibrary = foodLibrary || [];
  state.measurements = measurements || [];
  state.photos = photosRes.photos || [];
  state.programs = programs || [];
  state.activeSession = sessionRes.session || null;
  state.steps = steps || [];
  state.cardioLog = cardioLog || [];
  state.profile = profile || null;
  state.dietPlan = dietPlan || null;
  state.waterLog = waterLog || [];
  state.fuelDate = todayStr();
  state.loaded = true;
}

/* ============================================================
   CROSS-DEVICE SYNC — cheap polling for a second device (e.g. an
   iPhone) sharing this same server/database. The server keeps an
   in-memory revision counter that bumps on every write; we poll that
   tiny endpoint on an interval and only pay for a full state refresh
   when it actually moved. Never refreshes while a modal is open, a
   draft edit is in flight, or an input is focused — that would
   silently discard whatever you're mid-typing.
============================================================ */
let lastSeenRev = null;
let pollTimer = null;

function pollBlocked(){
  const modalRoot = document.getElementById('modalRoot');
  if(modalRoot && modalRoot.innerHTML.trim() !== "") return true;
  if(draftWorkout || draftSteps || draftCardio || draftProfile || draftDietPlan || draftMeasurement || draftPhoto || draftProgram) return true;
  const el = document.activeElement;
  if(el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return true;
  return false;
}

async function refreshFromServer(){
  const scrollY = window.scrollY;
  const fuelDate = state.fuelDate;
  await loadAll();
  state.fuelDate = fuelDate;
  renderApp();
  window.scrollTo({top: scrollY, behavior:'instant'});
}

async function pollForRemoteChanges(){
  if(document.visibilityState !== 'visible') return;
  if(pollBlocked()) return;
  let rev;
  try{
    ({rev} = await apiGet('/meta/rev'));
  }catch(e){ return; } // offline/unreachable — normal on a phone, not an error to surface here

  if(lastSeenRev === null){ lastSeenRev = rev; return; }
  if(rev === lastSeenRev) return;
  lastSeenRev = rev;
  await refreshFromServer();
}

const POLL_INTERVAL_MS = 15000;
function startPolling(){
  stopPolling();
  pollTimer = setInterval(pollForRemoteChanges, POLL_INTERVAL_MS);
}
function stopPolling(){
  if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
}
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible'){ pollForRemoteChanges(); startPolling(); }
  else stopPolling();
});
window.addEventListener('focus', pollForRemoteChanges);

/* ============================================================
   UTIL
============================================================ */
let toastTimer = null;
function showToast(msg, kind){
  clearTimeout(toastTimer);
  const root = document.getElementById('toastRoot');
  const cls = kind ? ' '+kind : '';
  root.innerHTML = `<div class="toast${cls}" role="status" aria-live="polite"><span class="dot"></span>${escapeHtml(msg)}</div>`;
  toastTimer = setTimeout(()=>{ root.innerHTML=""; }, 2600);
}
function escapeHtml(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(d){
  const dt = new Date(d + "T00:00:00");
  return dt.toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'});
}
function fmtShort(d){
  const dt = new Date(d + "T00:00:00");
  return dt.toLocaleDateString(undefined, {month:'short', day:'numeric'});
}
function dietTotals(day){
  const t = {calories:0, protein:0, carbs:0, fat:0, fiber:0};
  if(!day || !day.meals) return t;
  MEAL_SLOTS.forEach(m => (day.meals[m.key]||[]).forEach(f => {
    t.calories += Number(f.calories)||0;
    t.protein += Number(f.protein)||0;
    t.carbs += Number(f.carbs)||0;
    t.fat += Number(f.fat)||0;
    t.fiber += Number(f.fiber)||0;
  }));
  return t;
}
function allExerciseNames(){
  return [...new Set([...EXERCISE_LIBRARY_DEFAULT, ...state.exerciseLibrary])].sort();
}
function trainingStreak(){
  const dates = new Set(state.workouts.map(w=>w.date));
  let streak = 0;
  let d = new Date();
  // allow "today not logged yet" to not break a streak that continues yesterday
  if(!dates.has(todayStr())) d.setDate(d.getDate()-1);
  while(true){
    const s = d.toISOString().slice(0,10);
    if(dates.has(s)){ streak++; d.setDate(d.getDate()-1); } else break;
  }
  return streak;
}
function getActiveProgram(){
  return state.programs.find(p=>p.active) || null;
}
// Weekday derived the same way the server's workoutProgramService does (UTC,
// from the date STRING) — see the comment there on why parsing todayStr()
// as local time and reading it back with UTC getters would silently shift
// by a day for most users.
function getTodaysProgramDay(){
  const program = getActiveProgram();
  if(!program) return null;
  const weekday = new Date(todayStr()+'T00:00:00Z').getUTCDay();
  return program.days.find(d=>d.weekday===weekday) || null;
}

/* ============================================================
   CONFIRM SHEET — replaces native confirm() everywhere
============================================================ */
function confirmSheet(message, onYes, opts){
  const o = Object.assign({yes:'Delete', danger:true}, opts||{});
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-overlay confirm-sheet" onclick="if(event.target===this) closeModal()">
      <div class="modal-sheet" role="dialog" aria-modal="true">
        <div class="display" style="font-size:18px;margin-bottom:8px;">Are you sure?</div>
        <div class="muted small">${escapeHtml(message)}</div>
        <div class="row">
          <button class="btn btn-ghost btn-block" onclick="closeModal()">Cancel</button>
          <button class="btn ${o.danger?'btn-danger':'btn-primary'} btn-block" id="confirmYesBtn">${escapeHtml(o.yes)}</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('confirmYesBtn').onclick = ()=>{ closeModal(); onYes(); };
}

/* ============================================================
   PHASE BADGE
============================================================ */
function cyclePhase(){
  const order = ["offseason","prep","peak"];
  const i = order.indexOf(state.settings.phase);
  const next = order[(i+1) % order.length];
  if(state.settings.targetsEdited){
    confirmSheet(`Switch to ${PHASE_PRESETS[next].label} and reset your macro targets to that preset? Your edited targets will be replaced.`, ()=>applyPreset(next), {yes:'Switch', danger:false});
  } else {
    applyPreset(next);
  }
}
function renderPhaseBadge(){
  const b = document.getElementById('phaseBadge');
  const p = state.settings.phase;
  b.className = `phase-badge phase-${p}`;
  b.textContent = PHASE_PRESETS[p].label;
}

/* ============================================================
   NAV
============================================================ */

/* ============================================================
   DASHBOARD (hero)
============================================================ */
function sparklinePath(vals, w, h){
  if(vals.length < 2) return '';
  const min = Math.min(...vals), max = Math.max(...vals), range=(max-min)||1;
  const step = w/(vals.length-1);
  return vals.map((v,i)=>{
    const x = i*step, y = h - ((v-min)/range)*h;
    return (i===0?'M':'L')+x.toFixed(1)+','+y.toFixed(1);
  }).join(' ');
}

// too so the modal can show a live readout without a round-trip.
function computeBMI(heightCm, weightKg){
  if(!heightCm || !weightKg) return null;

  return {value: Math.round(bmi*10)/10, category};

async function setWaterLevel(i){
  const incrementL = state.profile?.waterIncrementL || 1;

  const idx = state.waterLog.findIndex(w=>w.date===date);
  const currentFilled = idx>=0 ? Math.round(state.waterLog[idx].amountL/incrementL) : 0;

function renderMacroBar(label, val, target, unit){
  // Color encodes STATE (how close to target), not macro identity — the label
  // already says which macro this is, so identity-by-hue was a wasted channel.
  unit = unit || 'g';
  const pct = target ? Math.round(val/target*100) : 0;
  const shown = Math.min(100, pct);
  const over = Math.max(0, pct-100);
  const onTarget = pct>=100 && pct<=105;
  let fill = 'var(--acid-deep)';       // < 85%: quiet, work to do
  if(pct>=85 && pct<100) fill = 'var(--acid-core)';   // closing in
  if(onTarget) fill = 'var(--acid)';                   // hit it — the glow moment
  const glow = onTarget ? 'box-shadow:0 0 10px var(--acid-glow);' : '';
  return `
    <div class="macrobar">
      <div class="macrobar-top"><span class="muted">${label}</span><span class="mono ${pct>100?'warn-text':''}">${onTarget?'✓ ':''}${Math.round(val)} / ${target}${unit}${pct>100?' ('+(pct-100)+'% over)':''}</span></div>
      <div class="macrobar-track">
        <div class="macrobar-fill" style="width:${shown}%;background:${fill};${glow}"></div>
        ${over>0 ? `<div class="macrobar-over" style="left:${Math.max(0,100-over)}%;width:${Math.min(over,100)}%;"></div>` : ''}
      </div>
    </div>
  `;
}

/* ============================================================
   CHARTS — one shared drawing routine, measured viewBox,
   axes/gridlines/hover. Called post-render (two-pass), like
   renderPhaseBadge already does.
============================================================ */
function niceStep(rough){
  const mag = Math.pow(10, Math.floor(Math.log10(rough||1)));
  const n = rough/mag;
  const step = n<1.5?1:n<3?2:n<7?5:10;
  return step*mag;
}
function niceCeil(max, ticks){
  const step = niceStep(max/(ticks-1));
  return {step, ceil: Math.ceil(max/step)*step};
}
function drawChart(containerId, opts){
  const el = document.getElementById(containerId);
  if(!el) return;
  const {points, zeroBased, unit, fmtVal, fmtX, areaFill, extraSeries} = opts;
  if(!points || points.length < 2) return; // empty message already in template
  const width = Math.max(240, el.clientWidth || 600);
  const H = window.innerWidth >= 1024 ? 220 : 180;
  const pad = {t:16, r:14, b:26, l:44};
  const vals = points.map(p=>p.y);
  let yMin, yMax;
  if(zeroBased){
    const {ceil} = niceCeil(Math.max(...vals,1), 4);
    yMin = 0; yMax = ceil;
  } else {
    const lo = Math.min(...vals), hi = Math.max(...vals);
    const range = (hi-lo)||1;
    yMin = Math.floor((lo - range*0.15)*2)/2;
    yMax = Math.ceil((hi + range*0.15)*2)/2;
  }
  const plotW = width - pad.l - pad.r, plotH = H - pad.t - pad.b;
  const xAt = i => pad.l + (points.length===1?0:i*(plotW/(points.length-1)));
  const yAt = v => pad.t + plotH - ((v-yMin)/(yMax-yMin||1))*plotH;

  const pts = points.map((p,i)=>[xAt(i), yAt(p.y)]);
  const path = pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');

  let gridSvg = '';
  const ticks = 4;
  for(let i=0;i<=ticks;i++){
    const v = yMin + (yMax-yMin)*(i/ticks);
    const y = yAt(v);
    gridSvg += `<line x1="${pad.l}" y1="${y.toFixed(1)}" x2="${width-pad.r}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`;
    gridSvg += `<text x="${pad.l-8}" y="${(y+3).toFixed(1)}" text-anchor="end" class="mono" font-size="10" fill="var(--ink-3)">${fmtVal(v)}</text>`;
  }

  let areaSvg = '';
  if(areaFill){
    const gid = containerId+'-grad';
    const base = yAt(Math.max(yMin,0));
    const areaPath = path + ` L${pts[pts.length-1][0].toFixed(1)},${base.toFixed(1)} L${pts[0][0].toFixed(1)},${base.toFixed(1)} Z`;
    areaSvg = `<defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--acid)" stop-opacity="0.28"/>
        <stop offset="100%" stop-color="var(--acid)" stop-opacity="0"/>
      </linearGradient></defs>
      <path d="${areaPath}" fill="url(#${gid})"/>`;
  }

  let extraSvg = '';
  if(extraSeries){
    const epts = extraSeries.map((v,i)=>[xAt(i), yAt(v)]);
    const epath = epts.filter(p=>!isNaN(p[1])).map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
    extraSvg = `<path d="${epath}" fill="none" stroke="var(--ink-3)" stroke-width="1.5" stroke-dasharray="4 3"/>`;
  }

  const dotsSvg = pts.map((p,i)=> i===pts.length-1
    ? `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="5" fill="var(--acid)" stroke="var(--surface)" stroke-width="2"/>`
    : `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="var(--acid)" stroke="var(--surface)" stroke-width="2"/>`
  ).join('');

  const xLabels = [];
  const showEvery = window.innerWidth >= 1024 ? Math.max(1, Math.ceil(points.length/8)) : Math.max(1, points.length-1);
  const idxs = window.innerWidth >= 1024 ? points.map((_,i)=>i).filter(i=>i%showEvery===0) : [0, points.length-1];
  [...new Set(idxs)].forEach(i=>{
    xLabels.push(`<text x="${xAt(i).toFixed(1)}" y="${H-6}" text-anchor="${i===0?'start':(i===points.length-1?'end':'middle')}" class="mono" font-size="10" fill="var(--ink-3)">${fmtX(points[i].x)}</text>`);
  });

  const endLabel = `<text x="${pts[pts.length-1][0].toFixed(1)}" y="${(pts[pts.length-1][1]-10).toFixed(1)}" text-anchor="end" class="mono" font-size="11" fill="var(--chalk)" font-weight="700">${fmtVal(points[points.length-1].y)}${unit||''}</text>`;

  chartData[containerId] = {points, xAt, yAt, fmtVal, fmtX, unit};

  el.innerHTML = `
    <svg viewBox="0 0 ${width} ${H}" width="${width}" height="${H}" role="img" aria-label="${escapeHtml((opts.ariaLabel||'chart'))}"
      onpointermove="chartHover(event,'${containerId}')" onpointerleave="chartOut('${containerId}')">
      <title>${escapeHtml(opts.ariaLabel||'')}</title>
      ${gridSvg}
      ${areaSvg}
      ${extraSvg}
      <path d="${path}" fill="none" stroke="var(--acid)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${dotsSvg}
      ${endLabel}
      ${xLabels.join('')}
      <line id="${containerId}-cross" x1="0" y1="${pad.t}" x2="0" y2="${H-pad.b}" stroke="var(--ink-3)" stroke-width="1" style="display:none;"/>
    </svg>
    <div class="chart-tooltip" id="${containerId}-tip"></div>
  `;
}
function chartHover(evt, id){
  const d = chartData[id];
  if(!d) return;
  const svg = evt.currentTarget;
  const rect = svg.getBoundingClientRect();
  const scaleX = svg.viewBox.baseVal.width / rect.width;
  const localX = (evt.clientX - rect.left) * scaleX;
  let nearest = 0, best = Infinity;
  d.points.forEach((p,i)=>{ const dx = Math.abs(d.xAt(i)-localX); if(dx<best){best=dx;nearest=i;} });
  const cross = document.getElementById(id+'-cross');
  const tip = document.getElementById(id+'-tip');
  if(cross){ cross.style.display='block'; cross.setAttribute('x1', d.xAt(nearest)); cross.setAttribute('x2', d.xAt(nearest)); }
  if(tip){
    tip.style.display='block';
    tip.style.left = ((d.xAt(nearest)/svg.viewBox.baseVal.width)*rect.width)+'px';
    tip.style.top = ((d.yAt(d.points[nearest].y)/svg.viewBox.baseVal.height)*rect.height)+'px';
    tip.textContent = `${d.fmtX(d.points[nearest].x)} · ${d.fmtVal(d.points[nearest].y)}${d.unit||''}`;
  }
}
function chartOut(id){
  const cross = document.getElementById(id+'-cross');
  const tip = document.getElementById(id+'-tip');
  if(cross) cross.style.display='none';
  if(tip) tip.style.display='none';
}
function movingAvg(vals, window){
  return vals.map((_,i)=>{
    const start = Math.max(0,i-window+1);
    const slice = vals.slice(start,i+1);
    return slice.reduce((a,b)=>a+b,0)/slice.length;
  });
}
function drawWeightChart(){
  const list = [...state.measurements].filter(m=>m.weight).sort((a,b)=> a.date<b.date?-1:1).slice(-20);
  const el = document.getElementById('ch-weight');

  if(list.length < 2) return;
  const points = list.map(m=>({x:m.date, y:Number(m.weight)}));
  const avg = movingAvg(points.map(p=>p.y), 7);
  drawChart('ch-weight', {
    points, zeroBased:false, unit:state.settings.unit, areaFill:false, extraSeries:avg,
    fmtVal:v=>v.toFixed(1), fmtX:fmtShort,

  });
}

function stopRestTimer(exUid){
  if(restIntervals.has(exUid)){ clearInterval(restIntervals.get(exUid)); restIntervals.delete(exUid); }
}
function stopAllRestTimers(){
  restIntervals.forEach(id=>clearInterval(id));
  restIntervals.clear();
}
const REST_RING_R = 15;
const REST_RING_C = 2*Math.PI*REST_RING_R;
function startRestTimer(exUid, seconds){
  const ex = findEx(exUid);
  if(!ex) return;
  stopRestTimer(exUid);
  ex.restTotal = seconds;
  ex.restSecLeft = seconds;
  rerenderExerciseBlock(exUid);
  const iv = setInterval(()=>{
    ex.restSecLeft -= 1;
    const circle = document.getElementById(`rest-ring-c-${exUid}`);
    const txt = document.getElementById(`rest-txt-${exUid}`);
    if(circle){
      const pct = Math.max(0, 1 - ex.restSecLeft/ex.restTotal);
      circle.style.strokeDashoffset = (REST_RING_C * (1-pct)).toFixed(1);
    }
    if(txt) txt.innerHTML = ex.restSecLeft > 0 ? `<b>${ex.restSecLeft}s</b>` : `<b>Stretch 10–15s</b>`;
    if(ex.restSecLeft <= 0){ stopRestTimer(exUid); }
  }, 1000);
  restIntervals.set(exUid, iv);
}

function renderGauge7(ex){
  const filled = ex.sets.filter(s => s.weight!=="" && s.reps!=="").length;
  const activeIdx = filled<7 ? filled : -1;
  const segs = Array.from({length:7}, (_,k)=>{
    const isFilled = k < filled;
    const isActive = k === activeIdx;
    const color = isFilled ? `background:${lerpAcid(k/6)};` : '';
    return `<div class="seg ${isFilled?'filled':''} ${isActive?'pulse':''}"><div class="fill" style="${color}"></div></div>`;
  }).join('');
  const running = ex.restSecLeft > 0 || ex.restTotal > 0;
  const pct = ex.restTotal ? Math.max(0, 1 - ex.restSecLeft/ex.restTotal) : 0;
  const restRow = running ? `
    <div class="rest-timer">
      <svg class="ring" viewBox="0 0 36 36">
        <circle cx="18" cy="18" r="${REST_RING_R}" fill="none" stroke="var(--surface)" stroke-width="3"/>
        <circle id="rest-ring-c-${ex.uid}" cx="18" cy="18" r="${REST_RING_R}" fill="none" stroke="var(--acid)" stroke-width="3"
          stroke-linecap="round" stroke-dasharray="${REST_RING_C.toFixed(1)}" stroke-dashoffset="${(REST_RING_C*(1-pct)).toFixed(1)}"
          transform="rotate(-90 18 18)"/>
      </svg>
      <div class="txt" id="rest-txt-${ex.uid}">${ex.restSecLeft>0 ? `<b>${ex.restSecLeft}s</b> rest` : '<b>Stretch 10–15s</b>'}</div>
    </div>` : '';
  return `
    <div class="gauge7-panel" id="gaugePanel-${ex.uid}">
      <div class="gauge7">${segs}</div>
      <div class="small muted">${filled}/7 sets · keep rest to 25–35s, hold a deep stretch after the last set</div>
      <button type="button" class="btn btn-ghost btn-sm" style="margin-top:8px;" onclick="startRestTimer('${ex.uid}', 30)">Start 30s Rest</button>
      ${restRow}
    </div>
  `;
}
async function saveWorkout(){
  if(draftWorkout.exercises.length === 0 || draftWorkout.exercises.every(e=>!e.name)){
    showToast("Add at least one exercise");
    return;
  }
  stopAllRestTimers();
  const clean = {
    id: uid(),
    date: draftWorkout.date,
    split: draftWorkout.split || "Workout",
    exercises: draftWorkout.exercises
      .filter(e => e.name)
      .map(e => ({ uid:e.uid, name:e.name, isFst7:e.isFst7, sets:e.sets.filter(s=>s.weight!=="" || s.reps!=="") }))
  };
  state.workouts.push(clean);
  clean.exercises.forEach(e=>{
    if(!EXERCISE_LIBRARY_DEFAULT.includes(e.name) && !state.exerciseLibrary.includes(e.name)){
      state.exerciseLibrary.push(e.name);
    }
  });
  await saveKey('workouts', state.workouts);
  await saveKey('exerciseLibrary', state.exerciseLibrary);
  draftWorkout = null;
  closeModal();
  switchTab('train');
  showToast("Workout saved 💪","success");
}

/* ============================================================
   EXECUTION MODE — the live "Start Workout" session. Server owns
   the truth (`activeSession` kv key); the client mirrors it in
   state.activeSession after every call and ticks the elapsed-time
   display locally from `startedAt` so it stays correct even after
   the tab or laptop was asleep.
============================================================ */
function formatDuration(totalSec){
  const h = Math.floor(totalSec/3600), m = Math.floor((totalSec%3600)/60), s = totalSec%60;
  const pad = n => String(n).padStart(2,'0');
  return h>0 ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}
function sessionElapsedSeconds(){
  if(!state.activeSession) return 0;
  return Math.max(0, Math.floor((Date.now() - new Date(state.activeSession.startedAt).getTime())/1000));
}
function stopSessionTicker(){
  if(sessionTicker){ clearInterval(sessionTicker); sessionTicker = null; }
}
const SESSION_LENGTH_NUDGE_SEC = 60*60; // a typical session length — one-time, not a hard limit
let sessionNudgeShown = false;
function startSessionTicker(){
  stopSessionTicker();
  sessionTicker = setInterval(()=>{
    if(!state.activeSession){ stopSessionTicker(); return; }
    const secs = sessionElapsedSeconds();
    const text = formatDuration(secs);
    document.querySelectorAll('.session-elapsed').forEach(el => el.textContent = text);
    if(secs >= SESSION_LENGTH_NUDGE_SEC && !sessionNudgeShown){
      sessionNudgeShown = true;
      showToast("You've been at it an hour — consider wrapping up soon","success");
    }
  }, 1000);
}
// The generic "Start Workout" button (Train tab's Program card, shown any
// time a program exists, not just on a day it's actually scheduled) can't
// call startWorkoutFlow() bare — that resolves TODAY's due day server-side,
// which is null on any day the program doesn't schedule something, and
// silently starts an empty, nameless session (the exact bug reported: no
// workout name shows because there ARE no exercises). Always let the user
// pick which day's workout to run instead.

        ${[...program.days].sort((a,b)=>a.weekday-b.weekday).map(d=>`
          <button class="btn btn-ghost btn-block" style="margin-bottom:8px;justify-content:space-between;" onclick="closeModal(); startWorkoutFlow('${program.id}','${d.id}')">
            <span>${escapeHtml(d.splitName)}</span>
            <span class="small muted">${WEEKDAY_LABELS[d.weekday].slice(0,3)} · ${d.exercises.length} exercise${d.exercises.length===1?'':'s'}</span>
          </button>
        `).join('')}
      </div>
    </div>
  `;
  document.getElementById('modalRoot').innerHTML = html;
}
async function startWorkoutFlow(programId, dayId){
  try{

  const html = `

          <div class="small muted" style="text-align:right;">Exercise ${s.exercises.length ? s.exerciseIdx+1 : 0}/${s.exercises.length}</div>

function renderCompareTool(sorted){
  if(!compareIds[0]) compareIds[0] = sorted[sorted.length-1].id;
  if(!compareIds[1]) compareIds[1] = sorted[0].id;
  const p0 = state.photos.find(p=>p.id===compareIds[0]);
  const p1 = state.photos.find(p=>p.id===compareIds[1]);
  const days = (p0&&p1) ? Math.round((new Date(p1.date)-new Date(p0.date))/86400000) : null;
  return `
    <div class="card">
      <div class="card-head"><h3>Compare</h3>${days!==null?`<span class="mono small accent" style="color:var(--acid);">${days>=0?'+':''}${days}d</span>`:''}</div>
      <div class="compare-select">
        <select onchange="compareIds[0]=this.value; renderApp();">
          ${sorted.map(p=>`<option value="${p.id}" ${p.id===compareIds[0]?'selected':''}>${fmtShort(p.date)} · ${p.pose}</option>`).join('')}
        </select>
        <select onchange="compareIds[1]=this.value; renderApp();">
          ${sorted.map(p=>`<option value="${p.id}" ${p.id===compareIds[1]?'selected':''}>${fmtShort(p.date)} · ${p.pose}</option>`).join('')}
        </select>
      </div>
      <div class="compare-view" id="compareView"
        onpointerdown="compareFadeStart(event)" onpointermove="compareFadeMove(event)" onpointerup="compareFadeEnd(event)" onpointerleave="compareFadeEnd(event)">
        ${p0?`<img data-photo-id="${p0.id}" data-variant="display" alt="before">`:''}
        ${p1?`<img data-photo-id="${p1.id}" data-variant="display" class="top" style="opacity:${compareFade/100}" alt="after">`:''}
      </div>
      <div class="compare-hint">Hold + drag to fade between them</div>
    </div>
  `;
}
let compareDragging = false;
function compareFadeStart(e){ compareDragging = true; compareFadeMove(e); }
function compareFadeMove(e){
  if(!compareDragging) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const pct = Math.min(100, Math.max(0, ((e.clientX-rect.left)/rect.width)*100));
  compareFade = pct;
  const top = e.currentTarget.querySelector('img.top');
  if(top) top.style.opacity = pct/100;
}
function compareFadeEnd(){ compareDragging = false; }

function downscalePhotoBlob(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const mk = (maxW, q)=> new Promise(res=>{
          const scale = Math.min(1, maxW/img.width);
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width*scale);
          canvas.height = Math.round(img.height*scale);
          canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
          canvas.toBlob(b=>res(b), 'image/jpeg', q);
        });
        Promise.all([mk(1440,0.82), mk(320,0.72)]).then(([display,thumb])=>{
          resolve({display, thumb, w:img.width, h:img.height});
        });
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function handlePhotoFile(file){
  if(!file) return;
  const {display, thumb, w, h} = await downscalePhotoBlob(file);
  draftPhoto.blob = display; draftPhoto.thumb = thumb; draftPhoto.w = w; draftPhoto.h = h;
  const url = URL.createObjectURL(thumb);
  document.getElementById('previewWrap').innerHTML = `<img src="${url}" style="width:120px;border-radius:10px;margin:8px 0;display:block;">`;
  document.getElementById('uploadArea').textContent = 'Photo selected — tap to change';
}
async function savePhoto(){
  if(!draftPhoto.blob){ showToast("Choose a photo first"); return; }
  const form = new FormData();
  form.append('date', draftPhoto.date);

  form.append('note', draftPhoto.note || '');
  form.append('w', draftPhoto.w);
  form.append('h', draftPhoto.h);
  form.append('type', draftPhoto.blob.type || 'image/jpeg');
  form.append('display', draftPhoto.blob, 'display.jpg');
  form.append('thumb', draftPhoto.thumb, 'thumb.jpg');
  try{
    const meta = await (await fetch(API+'/photos', {method:'POST', body:form})).json();
    state.photos.push(meta);
    compareIds = [null,null];
    closeModal();
    switchTab('photos');
    showToast("Photo saved","success");
  }catch(e){
    showToast("Couldn't save photo — server error","error");

}

    const reg = await navigator.serviceWorker.getRegistration();
    if(reg){ await reg.update(); showToast("Checked — reload to apply","success"); return; }
  }
  showToast("Not running as an installed app");
}

async function exportBackup(){
  try{
    const data = await apiGet('/backup/export');
    const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
    const filename = `vishalxfit-backup-${todayStr()}.json`;
    if(navigator.canShare && navigator.share){
      const file = new File([blob], filename, {type:'application/json'});
      if(navigator.canShare({files:[file]})){
        navigator.share({files:[file], title:'VISHALXFIT backup'}).catch(()=>{ downloadBlob(blob, filename); });
        return;
      }
    }
    downloadBlob(blob, filename);
  }catch(e){ showToast("Couldn't export — server error","error"); }
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}
function importBackup(file){
  if(!file) return;
  confirmSheet("This replaces everything currently in VISHALXFIT with the backup file. Export a backup first if you're unsure.", async ()=>{
    try{
      const text = await file.text();
      const data = JSON.parse(text);
      const result = await apiSend('/backup/restore', 'POST', data);
      await loadAll();
      closeModal();
      switchTab('dashboard');
      showToast(`Restored ${result.counts.workouts} workouts, ${result.counts.photos} photos`,"success");
    }catch(e){
      console.error(e);
      showToast(e.message || "Couldn't read that backup file","error");
    }
  }, {yes:'Restore', danger:true});
}

/* ============================================================
   AI FOOD ESTIMATOR — Quick Log card on the Fuel tab. Fully automatic
   per the locked product decision: one call parses AND logs, no
   confirm step. All AI integration (the key, the OpenAI call, the
   food-parser normalization) lives server-side — see server/services/
   aiService.js + foodParserService.js. This is just the UI trigger.
============================================================ */
async function quickLogAI(){
  const descEl = document.getElementById('aiQuickDesc');
  const desc = descEl.value.trim();
  if(!desc){ showToast("Describe what you ate first"); return; }
  const slot = document.getElementById('aiQuickSlot').value;
  const btn = document.getElementById('aiQuickBtn');
  const original = btn.textContent;
  btn.textContent = "Logging…";
  btn.disabled = true;
  try{
    const result = await apiSend('/ai/estimate', 'POST', { description: desc, date: state.fuelDate || todayStr(), slot });
    descEl.value = '';
    const names = result.entries.map(e=>e.name).join(', ');
    state.dietLog = await loadKey('dietLog', state.dietLog);
    renderApp();
    showToast(`Logged: ${names}`, "success");
  }catch(e){
    if(e.status === 412) showToast("Add your OpenAI key to server/.env, then restart the server","error");
    else if(e.status === 401) showToast("Server's OpenAI key was rejected","error");
    else if(e.status === 429) showToast("Rate limited or out of credit","error");
    else showToast(e.message || "Couldn't estimate — try rephrasing","error");
  }finally{
    btn.textContent = original;
    btn.disabled = false;
  }
}

/* ============================================================
   SERVICE WORKER + BRAND MARK MOUNT
============================================================ */
function mountBrandMark(){
  // The seven-staves graphic is intentionally NOT part of the in-app wordmark
  // (text-only, per the logo decision) — it still lives in the boot curtain's
  // loading animation and in the installed home-screen icon (separate PNG assets).
  const boot = document.getElementById('bootGauge');
  if(boot) boot.innerHTML = sevenStavesSvg({filled:7});
}

/* ============================================================
   TOPBAR CLOCK — greeting + live date/time. Lives in the static
   shell (not re-rendered per tab), so it's mounted/ticked directly
   rather than through renderApp().
============================================================ */
function getGreeting(){
  const h = new Date().getHours();
  if(h < 5) return 'Good Night';
  if(h < 12) return 'Good Morning';
  if(h < 17) return 'Good Afternoon';
  if(h < 21) return 'Good Evening';
  return 'Good Night';
}
function renderTopbarClock(){
  const now = new Date();
  const time = now.toLocaleTimeString(undefined, {hour:'numeric', minute:'2-digit'});
  const date = now.toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric'});
  return `<div class="greeting">${getGreeting()}</div><div class="clock mono">${time} · ${date}</div>`;
}
function tickTopbarClock(){
  const el = document.getElementById('topbarClockbar');
  if(el) el.innerHTML = renderTopbarClock();
}
function startClockTicker(){
  tickTopbarClock();
  setInterval(tickTopbarClock, 30000);
}
function registerSW(){
  if(!location.protocol.startsWith('http')) return;
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
}

/* ============================================================
   INIT
============================================================ */
(async function init(){
  mountBrandMark();
  startClockTicker();
  const reachable = await loadMeta();
  if(reachable) await loadAll();
  renderApp();
  registerSW();
  if(reachable) startPolling(); // cross-device sync — see pollForRemoteChanges()
  const boot = document.getElementById('boot');
  if(boot){ boot.style.transition='opacity .25s ease'; boot.style.opacity='0'; setTimeout(()=>boot.remove(), 260); }
  // honor the manifest's home-screen shortcuts (long-press the app icon)
  const shortcutAction = new URLSearchParams(location.search).get('a');
  if(shortcutAction === 'workout') openWorkoutForm();
  if(shortcutAction === 'meal') switchTab('fuel'), setTimeout(()=>document.getElementById('aiQuickDesc')?.focus(),0);
})();
</script>
