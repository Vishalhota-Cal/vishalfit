/* ============================================================
   TODAY'S PERFORMANCE — a training-adherence score, not a
   physiological claim. Every component is DERIVED from data the user
   actually logged; a component with nothing to derive from is left
   out of the weighted average entirely and shown as "—", rather than
   guessed. No new storage — same reasoning as PRs and best-streak.
============================================================ */
function computePerformance(trainingPct){
  const today = todayStr();
  const day = state.dietLog.find(d=>d.date===today);
  const totals = dietTotals(day);
  const t = state.settings.targets || {};

  // Nutrition: mean of protein/carbs/fat as a fraction of target (capped at
  // 1 — overshooting a macro isn't "extra credit"), with a mild penalty for
  // running over on calories specifically.
  const clampRatio = (v, tg) => tg ? Math.min(1, v/tg) : null;
  const macroRatios = ['protein','carbs','fat'].map(k => clampRatio(totals[k], t[k])).filter(v => v!==null);
  let nutrition = null;
  if(macroRatios.length){
    const mean = macroRatios.reduce((a,b)=>a+b, 0) / macroRatios.length;
    const overPenalty = (t.calories && totals.calories > t.calories) ? Math.min(0.3, (totals.calories - t.calories)/t.calories) : 0;
    nutrition = Math.round(Math.max(0, Math.min(1, mean - overPenalty)) * 100);
  }

  const targetL = state.profile?.waterTargetL;
  const todayWater = todaysWaterEntry()?.amountL || 0;
  const hydration = targetL ? Math.round(Math.min(1, todayWater/targetL) * 100) : null;

  // Recovery: today's consecutive-training-day count, penalized past 3 days
  // straight with no rest day — a real adequacy signal from data already
  // logged, not a guess at actual physiological recovery.
  const trainedDates = new Set(state.workouts.map(w=>w.date));
  let recovery = null;
  if(trainedDates.size){
    let consecutive = 0;
    let d = new Date(today+'T00:00:00Z');
    while(trainedDates.has(d.toISOString().slice(0,10))){ consecutive++; d.setUTCDate(d.getUTCDate()-1); }
    recovery = Math.max(0, 100 - Math.max(0, consecutive-3)*20);
  }

  const parts = [
    {key:'training', label:'Training', value: (typeof trainingPct==='number' ? trainingPct : null), weight:0.35},
    {key:'nutrition', label:'Nutrition', value: nutrition, weight:0.30},
    {key:'recovery', label:'Recovery', value: recovery, weight:0.20},
    {key:'hydration', label:'Hydration', value: hydration, weight:0.15},
  ];
  const available = parts.filter(p => p.value !== null);
  let total = null;
  if(available.length){
    const wSum = available.reduce((s,p)=>s+p.weight, 0);
    total = Math.round(available.reduce((s,p)=>s+p.value*p.weight, 0) / wSum);
  }
  return {total, parts};
}
function performanceLabel(total){
  if(total===null) return '';
  if(total>=85) return 'EXCELLENT';
  if(total>=70) return 'GOOD';
  if(total>=50) return 'FAIR';
  return 'NEEDS WORK';
}
function renderPerformanceCardContent(trainingPct){
  const {total, parts} = computePerformance(trainingPct);
  return `
    <div class="card-head"><h3>Today's Performance</h3><span class="small muted">adherence score</span></div>
    ${total===null ? `<div class="muted small">Log training, food, or water today to see this.</div>` : `
      <div class="perf-score">
        <span class="countup" data-target="${total}" data-key="perf-total">0</span>
        <span class="perf-label">${performanceLabel(total)}</span>
      </div>
    `}
    <div class="perf-parts">
      ${parts.map(p => `

}
function renderChecklistCardContent(checklist){

/* ============================================================
   EXECUTION MODE — the live "Start Workout" session. Server owns
   the truth (`activeSession` kv key); the client mirrors it in
   state.activeSession after every call and ticks the elapsed-time
   display locally from `startedAt` so it stays correct even after
   the tab or laptop was asleep.
============================================================ */
function formatDuration(totalSec){
  const h = Math.floor(totalSec/3600), m = Math.floor((totalSec%3600)/60), s = totalSec%60;
  const pad = n => String(n).padStart(2,'0');
  return h>0 ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}
function sessionElapsedSeconds(){
  if(!state.activeSession) return 0;
  return Math.max(0, Math.floor((Date.now() - new Date(state.activeSession.startedAt).getTime())/1000));
}
function stopSessionTicker(){
  if(sessionTicker){ clearInterval(sessionTicker); sessionTicker = null; }
}
const SESSION_LENGTH_NUDGE_SEC = 60*60; // a typical session length — one-time, not a hard limit
let sessionNudgeShown = false;
function startSessionTicker(){
  stopSessionTicker();
  sessionTicker = setInterval(()=>{
    if(!state.activeSession){ stopSessionTicker(); return; }
    const secs = sessionElapsedSeconds();
    const text = formatDuration(secs);
    document.querySelectorAll('.session-elapsed').forEach(el => el.textContent = text);
    if(secs >= SESSION_LENGTH_NUDGE_SEC && !sessionNudgeShown){
      sessionNudgeShown = true;
      showToast("You've been at it an hour — consider wrapping up soon","success");
    }
  }, 1000);
}
// The generic "Start Workout" button (Train tab's Program card, shown any
// time a program exists, not just on a day it's actually scheduled) can't
// call startWorkoutFlow() bare — that resolves TODAY's due day server-side,
// which is null on any day the program doesn't schedule something, and
// silently starts an empty, nameless session (the exact bug reported: no
// workout name shows because there ARE no exercises). Always let the user
// pick which day's workout to run instead.
function openWorkoutDayPicker(){
  const program = getActiveProgram();
  if(!program || program.days.length===0){ showToast("Add a training day to your program first"); return; }
  const html = `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal-sheet" role="dialog" aria-modal="true">
        <div class="modal-head"><h2>Choose a Workout</h2><button class="icon-btn" onclick="closeModal()" aria-label="Close">${xIcon()}</button></div>
        ${[...program.days].sort((a,b)=>a.weekday-b.weekday).map(d=>`
          <button class="btn btn-ghost btn-block" style="margin-bottom:8px;justify-content:space-between;" onclick="closeModal(); startWorkoutFlow('${program.id}','${d.id}')">
            <span>${escapeHtml(d.splitName)}</span>
            <span class="small muted">${WEEKDAY_LABELS[d.weekday].slice(0,3)} · ${d.exercises.length} exercise${d.exercises.length===1?'':'s'}</span>
          </button>
        `).join('')}
      </div>
    </div>
  `;
  document.getElementById('modalRoot').innerHTML = html;
}

/* ============================================================
   START WORKOUT — 3·2·1 countdown, mounted in #fxRoot (never
   #modalRoot, since openWorkoutDayPicker's closeModal() would wipe
   anything mounted there). Runs concurrently with /session/start —
   the countdown never adds latency; if the network is slower it
   holds on a "waiting" pulse instead of cutting the countdown short.
============================================================ */
function startCountdownOverlay(){
  if(window.matchMedia('(prefers-reduced-motion:reduce)').matches){
    return { done: Promise.resolve(), dismiss(){}, waiting(){} };
  }
  const root = document.getElementById('fxRoot');
  const el = document.createElement('div');
  el.className = 'cd';
  el.innerHTML = `<div class="cd-ring"></div><div class="cd-num display" id="cdNum">3</div><div class="cd-hint">tap to skip</div>`;
  root.appendChild(el);
  let resolveDone, settled = false;
  const timers = [];
  const done = new Promise(r => resolveDone = r);
  const finish = ()=>{ if(settled) return; settled = true; timers.forEach(clearTimeout); resolveDone(); };
  const step = (label, delay) => timers.push(setTimeout(()=>{
    const n = document.getElementById('cdNum');
    if(!n) return;
    n.textContent = label;
    n.style.animation = 'none'; void n.offsetWidth; n.style.animation = 'cdPop .5s var(--ease-pop)';
  }, delay));
  step('2', 600); step('1', 1200); step('GO', 1800);
  timers.push(setTimeout(finish, 2150));
  el.addEventListener('pointerdown', finish);   // tap anywhere to skip
  return {
    done,
    dismiss(){ el.classList.add('cd-out'); setTimeout(()=>el.remove(), 240); },
    waiting(){ el.classList.add('cd-waiting'); }
  };
}
async function startWorkoutFlow(programId, dayId){
  if(isStartingSession) return;   // guards a double-tap starting two sessions
  isStartingSession = true;
  const cd = startCountdownOverlay();
  let netDone = false, netRes = null, netErr = null;
  const netPromise = apiSend('/session/start', 'POST', {programId, dayId})
    .then(r => { netRes = r; netDone = true; })
    .catch(e => { netErr = e; netDone = true; });
  await cd.done;                          // the countdown's own ~2.1s
  if(!netDone) cd.waiting();              // network is the slow one — pulse, don't cut the countdown short
  await netPromise;
  cd.dismiss();
  isStartingSession = false;
  if(netErr || !netRes){ showToast("Couldn't start — server error","error"); return; }
  state.activeSession = netRes.session;
  sessionNudgeShown = false;
  startSessionTicker();
  openExecutionMode();
}
function openExecutionMode(){
  if(!state.activeSession){ showToast("No active session"); return; }
  renderExecutionModal();
  startSessionTicker();
}

/* ============================================================
   EXECUTION MODE — pure checklist. Every exercise in the day's plan is
   listed by name (with its target sets/reps as a hint, if the program
   set one); tapping the active one just checks it off — no weight, no
   reps, no rest timer, no PR tracking. A checked exercise is recorded
   server-side as one placeholder set ({weight:null, reps:null}) so it
   still shows up in workout history via the existing /session/set API,
   just displayed as "Completed" instead of a weight×reps line.
   Every mutation re-renders the modal — there's no keystroke stream to
   protect scroll/focus for anymore (no text inputs left in here), so
   the old in-place-patch machinery is gone with it.
============================================================ */
function renderExecutionModal(opts){
  const o = Object.assign({animate:true, spotlight:false}, opts||{});
  const s = state.activeSession;
  if(!s){ showToast("No active session"); return; }
  const isLastExercise = s.exercises.length>0 && s.exerciseIdx === s.exercises.length-1;
  const cls = o.animate ? '' : ' no-anim';
  const html = `
    <div class="modal-overlay${cls}">
      <div class="modal-sheet${cls}" role="dialog" aria-modal="true">
        <div class="modal-head">
          <h2>${escapeHtml(s.splitName||'Workout')}</h2>
          <button class="icon-btn" onclick="closeModal()" aria-label="Close">${xIcon()}</button>
        </div>
        <div class="row" style="align-items:baseline;margin-bottom:14px;">
          <div class="mono session-elapsed" style="font-size:28px;color:var(--acid);">${formatDuration(sessionElapsedSeconds())}</div>
          <div class="small muted" style="text-align:right;">Exercise ${s.exercises.length ? s.exerciseIdx+1 : 0}/${s.exercises.length}</div>
        </div>
        ${isLastExercise ? `<div class="tag-pill tag-fst" style="display:block;text-align:center;margin-bottom:10px;padding:8px;">Last exercise — wrap it up when ready</div>` : ''}
        <div id="execBody">
          ${s.exercises.length===0 ? `<div class="muted small" style="margin-bottom:12px;">No exercises yet — add one below.</div>` :
            s.exercises.map((ex,i)=>renderExecChecklistRow(ex,i,s.exerciseIdx)).join('')}
        </div>
        <div class="row">
          <input type="text" id="execNewExName" list="exNamesProgram" placeholder="Add another exercise…">
          <button class="icon-btn" onclick="addExecExercise()" aria-label="Add exercise" style="flex:0 0 auto;">${plusIcon()}</button>
        </div>
        <datalist id="exNamesProgram">${allExerciseNames().map(n=>`<option value="${escapeHtml(n)}">`).join('')}</datalist>
        <div class="divider"></div>
        <button class="btn btn-primary btn-block" onclick="finishWorkoutSession()">FINISH WORKOUT</button>
        <button class="btn btn-ghost btn-block" onclick="discardWorkoutSession()">Discard session</button>
      </div>
    </div>
  `;
  document.getElementById('modalRoot').innerHTML = html;
  if(o.spotlight) document.getElementById('execActiveCard')?.scrollIntoView({block:'center', behavior:'smooth'});
}
function renderExecChecklistRow(ex, i, activeIdx){
  if(i === activeIdx) return renderExecActiveExercise(ex, i);
  const past = i < activeIdx;
  const done = past && ex.sets.length>0;
  const skipped = past && ex.sets.length===0;
  const glyph = done ? '✓' : skipped ? '–' : String(i+1);
  const color = done ? 'var(--acid)' : skipped ? 'var(--ink-3)' : 'var(--ink-2)';
  return `
    <button class="hist-item hist-top" style="width:100%;margin-bottom:8px;opacity:${past?0.7:1};" onclick="execGoTo(${i})">
      <div class="row" style="align-items:center;gap:10px;">
        <div class="mono" style="color:${color};font-weight:700;width:20px;text-align:center;">${glyph}</div>
        <div>
          <div style="font-weight:600;">${escapeHtml(ex.name)}</div>
          ${ex.targetSets?`<div class="small muted">${ex.targetSets} × ${escapeHtml(String(ex.targetReps||''))}</div>`:''}
        </div>
      </div>
    </button>
  `;
}
function renderExecActiveExercise(ex, i){
  const isLast = i >= state.activeSession.exercises.length-1;
  const done = ex.sets.length>0;
  return `
    <div class="card exec-active" id="execActiveCard" style="margin-bottom:12px;border-color:var(--line-acid);">
      <div class="hist-title">${escapeHtml(ex.name)}</div>
      ${ex.targetSets? `<div class="small muted">${ex.targetSets} × ${escapeHtml(String(ex.targetReps||''))}</div>`:''}
      <div class="divider"></div>
      <button class="exec-check${done?' is-done':''}" onclick="toggleExecDone(${i})">
        <span class="exec-check-dot">${done?checkIcon():''}</span>
        ${done ? 'Completed' : 'Mark as done'}
      </button>
      <button class="btn btn-primary btn-block" id="execCompleteBtn" style="margin-top:10px;" onclick="completeExecExercise(${i})">
        ${isLast ? '✓ Finish Workout' : '✓ Next Exercise'}
      </button>
    </div>
  `;
}
function completeExecExercise(i){
  if(i >= state.activeSession.exercises.length-1){ finishWorkoutSession(); return; }
  execGoTo(i+1);
}
async function toggleExecDone(i){
  const btn = document.querySelector('#execActiveCard .exec-check');
  if(btn && btn.dataset.busy) return;   // guards a double-tap
  if(btn) btn.dataset.busy = '1';
  const done = state.activeSession.exercises[i].sets.length>0;
  try{
    const res = done
      ? await apiSend('/session/set', 'DELETE', {exerciseIdx:i, setIdx:0})
      : await apiSend('/session/set', 'POST', {exerciseIdx:i, weight:null, reps:null});
    state.activeSession = res.session;
    renderExecutionModal({animate:false});
    try{ navigator.vibrate?.(done ? 12 : [12,30,12]); }catch(e){}
  }catch(e){
    if(e.status === 404){ execSessionVanished(); return; }
    showToast("Couldn't update checklist","error");
    if(btn) delete btn.dataset.busy;
  }
}
function execSessionVanished(){
  // Another device finished or discarded this session — every mutating
  // /session/* route 404s once activeSession is gone server-side.
  state.activeSession = null;
  stopSessionTicker();
  closeModal();
  renderApp();
  showToast("Session ended on another device","error");
}
async function execGoTo(idx){
  if(idx<0 || idx>=state.activeSession.exercises.length) return;
  try{
    const res = await apiSend('/session/exercise', 'POST', {idx});
    state.activeSession = res.session;
    renderExecutionModal({animate:false, spotlight:true});
  }catch(e){
    if(e.status === 404){ execSessionVanished(); return; }
    showToast("Couldn't switch exercise","error");
  }
}
async function addExecExercise(){
  const input = document.getElementById('execNewExName');
  const name = input.value.trim();
  if(!name) return;
  try{
    const res = await apiSend('/session/add-exercise', 'POST', {name});
    const res2 = await apiSend('/session/exercise', 'POST', {idx: res.session.exercises.length-1});
    state.activeSession = res2.session;
    renderExecutionModal({animate:false, spotlight:true});
  }catch(e){
    if(e.status === 404){ execSessionVanished(); return; }
    showToast("Couldn't add exercise","error");
  }
}
function finishWorkoutSession(){
  confirmSheet("Finish and save this workout to your history?", async ()=>{
    try{
      const res = await apiSend('/session/finish', 'POST');
      state.workouts.push(res.workout);
      state.activeSession = null;

      closeModal();
      switchTab('train');
      showToast("Workout saved 💪","success");

}
function discardWorkoutSession(){
  confirmSheet("Discard this session? Nothing will be saved.", async ()=>{
    try{
      await apiSend('/session', 'DELETE');
      state.activeSession = null;
      stopSessionTicker();
      closeModal();

}
function checkIcon(){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 13l4 4L19 7"/></svg>`; }

async function deleteFoodEntry(date, slotKey, idx){
  try{
    await apiSend('/meals', 'DELETE', { date, slot: slotKey, idx });
    const day = state.dietLog.find(d=>d.date===date);
    if(day) day.meals[slotKey].splice(idx,1);
    renderApp();
    // This route bypasses saveKey() (not a KV write), so lastSeenRev never
    // syncs on its own — without this, the next poll tick (≤15s) sees the
    // server's rev bump, thinks another device changed something, and
    // full-re-renders on top of whatever the user is doing.
    syncRevAfterNonKvWrite();
  }catch(e){ showToast("Couldn't remove — server error","error"); }
}
async function syncRevAfterNonKvWrite(){
  try{ const {rev} = await apiGet('/meta/rev'); lastSeenRev = rev; }catch(e){ /* next poll will just resync normally */ }
}

function hydratePhotoImages(){
  document.querySelectorAll('img[data-photo-id]').forEach(img=>{
    const id = img.dataset.photoId, variant = img.dataset.variant || 'display';
    img.src = `${API}/photos/${id}/${variant}`;
  });
}

function renderPhotos(){
  const sorted = [...state.photos].sort((a,b)=> a.date<b.date?1:-1);
  return `
    <div class="section-title">Photos</div>
    <button class="btn btn-primary btn-block" onclick="openPhotoForm()">+ Add Photo</button>
    ${sorted.length>=2 ? renderCompareTool(sorted) : ''}
    ${sorted.length===0 ? emptyState('No photos yet','Add your first progress shot.','+ Add Photo','openPhotoForm()') : `
      <div class="photo-grid">
        ${sorted.map(p=>`
          <button class="photo-thumb" onclick="openLightbox('${p.id}')" aria-label="Open photo from ${fmtShort(p.date)}">
            <img data-photo-id="${p.id}" data-variant="thumb" loading="lazy" decoding="async" alt="progress photo, ${escapeHtml(p.pose)}, ${fmtShort(p.date)}">
            <div class="pose-pill">${escapeHtml(p.pose)}</div>
            <div class="cap mono">${fmtShort(p.date)}</div>
          </button>
        `).join('')}
      </div>
    `}
  `;
}
function renderCompareTool(sorted){
  if(!compareIds[0]) compareIds[0] = sorted[sorted.length-1].id;
  if(!compareIds[1]) compareIds[1] = sorted[0].id;
  const p0 = state.photos.find(p=>p.id===compareIds[0]);
  const p1 = state.photos.find(p=>p.id===compareIds[1]);
  const days = (p0&&p1) ? Math.round((new Date(p1.date)-new Date(p0.date))/86400000) : null;
  return `
    <div class="card">
      <div class="card-head"><h3>Compare</h3>${days!==null?`<span class="mono small accent" style="color:var(--acid);">${days>=0?'+':''}${days}d</span>`:''}</div>
      <div class="compare-select">
        <select onchange="compareIds[0]=this.value; renderApp();">
          ${sorted.map(p=>`<option value="${p.id}" ${p.id===compareIds[0]?'selected':''}>${fmtShort(p.date)} · ${p.pose}</option>`).join('')}
        </select>
        <select onchange="compareIds[1]=this.value; renderApp();">
          ${sorted.map(p=>`<option value="${p.id}" ${p.id===compareIds[1]?'selected':''}>${fmtShort(p.date)} · ${p.pose}</option>`).join('')}
        </select>
      </div>
      <div class="compare-view" id="compareView"
        onpointerdown="compareFadeStart(event)" onpointermove="compareFadeMove(event)" onpointerup="compareFadeEnd(event)" onpointerleave="compareFadeEnd(event)">
        ${p0?`<img data-photo-id="${p0.id}" data-variant="display" alt="before">`:''}
        ${p1?`<img data-photo-id="${p1.id}" data-variant="display" class="top" style="opacity:${compareFade/100}" alt="after">`:''}
      </div>
      <div class="compare-hint">Hold + drag to fade between them</div>
    </div>
  `;
}
let compareDragging = false;
function compareFadeStart(e){ compareDragging = true; compareFadeMove(e); }
function compareFadeMove(e){
  if(!compareDragging) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const pct = Math.min(100, Math.max(0, ((e.clientX-rect.left)/rect.width)*100));
  compareFade = pct;
  const top = e.currentTarget.querySelector('img.top');
  if(top) top.style.opacity = pct/100;
}
function compareFadeEnd(){ compareDragging = false; }
function openLightbox(id){
  const p = state.photos.find(p=>p.id===id);
  if(!p) return;
  document.getElementById('modalRoot').innerHTML = `
    <div class="lightbox" onclick="closeLightbox()" role="dialog" aria-modal="true">
      <img data-photo-id="${p.id}" data-variant="display" alt="progress photo">
      <div class="mono small" style="color:var(--ink-2);margin-top:12px;">${fmtDate(p.date)} · ${escapeHtml(p.pose)}${p.note? ' · '+escapeHtml(p.note):''}</div>
      <button class="btn btn-danger btn-sm" style="margin-top:14px;" onclick="event.stopPropagation(); deletePhoto('${p.id}')">Delete Photo</button>
    </div>
  `;
  hydratePhotoImages();
}
function closeLightbox(){ document.getElementById('modalRoot').innerHTML=""; }
function deletePhoto(id){
  confirmSheet("Delete this photo?", async ()=>{
    try{
      await apiSend('/photos/'+id, 'DELETE');
      state.photos = state.photos.filter(p=>p.id!==id);
      closeLightbox();
      renderApp();
      showToast("Photo deleted","success");
    }catch(e){ showToast("Couldn't delete — server error","error"); }
  });
}
function openPhotoForm(){
  draftPhoto = {date: todayStr(), pose:'front', note:'', blob:null, thumb:null, w:0, h:0};
  renderPhotoModal();
}
function renderPhotoModal(){
  const d = draftPhoto;
  const html = `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal-sheet" role="dialog" aria-modal="true">
        <div class="modal-head"><h2>Add Progress Photo</h2><button class="icon-btn" onclick="closeModal()" aria-label="Close">${xIcon()}</button></div>
        <div class="row">
          <div class="field"><label>Date</label><input type="date" value="${d.date}" onchange="draftPhoto.date=this.value"></div>
          <div class="field"><label>Pose</label>
            <select onchange="draftPhoto.pose=this.value">
              <option value="front" ${d.pose==='front'?'selected':''}>Front</option>
              <option value="back" ${d.pose==='back'?'selected':''}>Back</option>
              <option value="side" ${d.pose==='side'?'selected':''}>Side</option>
              <option value="double-bi" ${d.pose==='double-bi'?'selected':''}>Double Bi</option>
              <option value="most-muscular" ${d.pose==='most-muscular'?'selected':''}>Most Muscular</option>
            </select>
          </div>
        </div>
        <div class="field"><label>Note (optional)</label><input type="text" placeholder="e.g. Week 6 prep, 82kg" value="${escapeHtml(d.note)}" onchange="draftPhoto.note=this.value"></div>
        <div class="field">
          <label>Photo</label>
          <button type="button" id="uploadArea" class="upload-drop" onclick="document.getElementById('fileInput').click()"
            ondragover="event.preventDefault(); this.classList.add('dragover');"
            ondragleave="this.classList.remove('dragover');"
            ondrop="event.preventDefault(); this.classList.remove('dragover'); handlePhotoFile(event.dataTransfer.files[0]);">
            Tap to choose, or drag a photo here
          </button>
          <input type="file" id="fileInput" accept="image/*" style="display:none;" onchange="handlePhotoFile(this.files[0])">
        </div>
        <div id="previewWrap"></div>
        <button class="btn btn-primary btn-block" onclick="savePhoto()">Save Photo</button>
      </div>
    </div>
  `;
  document.getElementById('modalRoot').innerHTML = html;
}
function downscalePhotoBlob(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const mk = (maxW, q)=> new Promise(res=>{
          const scale = Math.min(1, maxW/img.width);
          const canvas = document.createElement('canvas');
          canvas.width = Math.round(img.width*scale);
          canvas.height = Math.round(img.height*scale);
          canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
          canvas.toBlob(b=>res(b), 'image/jpeg', q);
        });
        Promise.all([mk(1440,0.82), mk(320,0.72)]).then(([display,thumb])=>{
          resolve({display, thumb, w:img.width, h:img.height});
        });
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function handlePhotoFile(file){
  if(!file) return;
  const {display, thumb, w, h} = await downscalePhotoBlob(file);
  draftPhoto.blob = display; draftPhoto.thumb = thumb; draftPhoto.w = w; draftPhoto.h = h;
  const url = URL.createObjectURL(thumb);
  document.getElementById('previewWrap').innerHTML = `<img src="${url}" style="width:120px;border-radius:10px;margin:8px 0;display:block;">`;
  document.getElementById('uploadArea').textContent = 'Photo selected — tap to change';
}
async function savePhoto(){
  if(!draftPhoto.blob){ showToast("Choose a photo first"); return; }
  const form = new FormData();
  form.append('date', draftPhoto.date);
  form.append('pose', draftPhoto.pose);
  form.append('note', draftPhoto.note || '');
  form.append('w', draftPhoto.w);
  form.append('h', draftPhoto.h);
  form.append('type', draftPhoto.blob.type || 'image/jpeg');
  form.append('display', draftPhoto.blob, 'display.jpg');
  form.append('thumb', draftPhoto.thumb, 'thumb.jpg');
  try{
    const meta = await (await fetch(API+'/photos', {method:'POST', body:form})).json();
    state.photos.push(meta);
    compareIds = [null,null];
    closeModal();
    switchTab('photos');
    showToast("Photo saved","success");
  }catch(e){
    showToast("Couldn't save photo — server error","error");
  }
}

function resetAllData(){
  confirmSheet("This permanently deletes ALL workouts, meals, measurements, photos, steps, cardio logs, your workout program, and your settings — back to a first-launch empty app. This cannot be undone.", async ()=>{
    try{
      await apiSend('/backup/reset', 'POST');
      await loadMeta();
      await loadAll();
      compareIds = [null,null];
      closeModal();
      switchTab('dashboard');
      showToast("Everything reset","success");
    }catch(e){ showToast("Couldn't reset — server error","error"); }
  }, {yes:'Reset everything', danger:true});
}
async function setUnit(u){
  state.settings.unit = u;
  await saveKey('settings', state.settings);
  renderSettingsModal();
  renderApp();
}
function saveAiSettings(){
  state.settings.aiModel = document.getElementById('oaModel').value.trim() || OPENAI_MODEL_DEFAULT;
  saveKey('settings', state.settings);
  showToast("Model saved","success");
}
async function testOpenAIKey(){
  try{
    const r = await apiGet('/ai/test-key');
    showToast(r.ok ? "Key is valid" : "Key rejected — check the server's OPENAI_API_KEY", r.ok?"success":"error");
  }catch(e){
    showToast(e.status===412 ? "No OPENAI_API_KEY set on the server" : "No connection to the server","error");
  }
}
async function checkForUpdate(){
  if('serviceWorker' in navigator){
    const reg = await navigator.serviceWorker.getRegistration();
    if(reg){ await reg.update(); showToast("Checked — reload to apply","success"); return; }
  }
  showToast("Not running as an installed app");
}

async function exportBackup(){
  try{
    const data = await apiGet('/backup/export');
    const blob = new Blob([JSON.stringify(data)], {type:'application/json'});
    const filename = `vishalxfit-backup-${todayStr()}.json`;
    if(navigator.canShare && navigator.share){
      const file = new File([blob], filename, {type:'application/json'});
      if(navigator.canShare({files:[file]})){
        navigator.share({files:[file], title:'VISHALXFIT backup'}).catch(()=>{ downloadBlob(blob, filename); });
        return;
      }
    }
    downloadBlob(blob, filename);
  }catch(e){ showToast("Couldn't export — server error","error"); }
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}
function importBackup(file){
  if(!file) return;
  confirmSheet("This replaces everything currently in VISHALXFIT with the backup file. Export a backup first if you're unsure.", async ()=>{
    try{
      const text = await file.text();
      const data = JSON.parse(text);
      const result = await apiSend('/backup/restore', 'POST', data);
      await loadAll();
      closeModal();
      switchTab('dashboard');
      showToast(`Restored ${result.counts.workouts} workouts, ${result.counts.photos} photos`,"success");
    }catch(e){
      console.error(e);
      showToast(e.message || "Couldn't read that backup file","error");
    }
  }, {yes:'Restore', danger:true});
}

/* ============================================================
   AI FOOD ESTIMATOR — Quick Log card on the Fuel tab. Fully automatic
   per the locked product decision: one call parses AND logs, no
   confirm step. All AI integration (the key, the OpenAI call, the
   food-parser normalization) lives server-side — see server/services/
   aiService.js + foodParserService.js. This is just the UI trigger.
============================================================ */
async function quickLogAI(){
  const descEl = document.getElementById('aiQuickDesc');
  const desc = descEl.value.trim();
  if(!desc){ showToast("Describe what you ate first"); return; }
  const slot = document.getElementById('aiQuickSlot').value;
  const btn = document.getElementById('aiQuickBtn');
  const original = btn.textContent;
  btn.textContent = "Logging…";
  btn.disabled = true;
  try{
    const result = await apiSend('/ai/estimate', 'POST', { description: desc, date: state.fuelDate || todayStr(), slot });
    descEl.value = '';
    const names = result.entries.map(e=>e.name).join(', ');
    state.dietLog = await loadKey('dietLog', state.dietLog);
    renderApp();
    syncRevAfterNonKvWrite(); // /ai/estimate bypasses saveKey — see deleteFoodEntry
    showToast(`Logged: ${names}`, "success");
  }catch(e){
    if(e.status === 412) showToast("No OpenAI key configured on the server","error");
    else if(e.status === 401) showToast("Server's OpenAI key was rejected","error");
    else if(e.status === 429) showToast("Rate limited or out of credit","error");
    else if(e.status === 504) showToast("AI request timed out — try again","error");
    else showToast(e.message || "Couldn't estimate — try rephrasing","error");
  }finally{
    btn.textContent = original;
    btn.disabled = false;
  }
}

/* ============================================================
   SERVICE WORKER + BRAND MARK MOUNT
============================================================ */
function mountBrandMark(){
  // The seven-staves graphic is intentionally NOT part of the in-app wordmark
  // (text-only, per the logo decision) — it still lives in the boot curtain's
  // loading animation and in the installed home-screen icon (separate PNG assets).
  const boot = document.getElementById('bootGauge');
  if(boot) boot.innerHTML = sevenStavesSvg({filled:7});
}

/* ============================================================
   TOPBAR CLOCK — greeting + live date/time. Lives in the static
   shell (not re-rendered per tab), so it's mounted/ticked directly
   rather than through renderApp().
============================================================ */
function getGreeting(){
  const h = new Date().getHours();
  if(h < 5) return 'Good Night';
  if(h < 12) return 'Good Morning';
  if(h < 17) return 'Good Afternoon';
  if(h < 21) return 'Good Evening';
  return 'Good Night';
}
function renderTopbarClock(){
  const now = new Date();
  const time = now.toLocaleTimeString(undefined, {hour:'numeric', minute:'2-digit'});
  const date = now.toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric'});
  return `<div class="greeting">${getGreeting()}</div><div class="clock mono">${time} · ${date}</div>`;
}
function tickTopbarClock(){
  const el = document.getElementById('topbarClockbar');
  if(el) el.innerHTML = renderTopbarClock();
}
function startClockTicker(){
  tickTopbarClock();
  setInterval(tickTopbarClock, 30000);
}
function registerSW(){
  if(!location.protocol.startsWith('http')) return;
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
    askSwVersion();
  }
}

/* ============================================================
   INIT
============================================================ */
(async function init(){
  const bootStart = Date.now();
  mountBrandMark();
  startClockTicker();
  initRipple();
  // Land back on whatever tab is in the URL (reload, bookmark, shared link)
  // instead of always defaulting to Dashboard.
  const hashTab = location.hash.slice(1);
  if(VALID_TABS.includes(hashTab)) state.tab = hashTab;
  const reachable = await loadMeta();
  if(reachable) await loadAll();
  renderApp();
  registerSW();
  if(reachable) startPolling(); // cross-device sync — see pollForRemoteChanges()
  const boot = document.getElementById('boot');
  if(boot){
    // Let the boot logo's own entrance animation finish before the curtain
    // fades — a warm cache/local reload can resolve loadAll() in a few ms,
    // which used to cut the logo's animation off mid-motion.
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const MIN_BOOT_MS = reduced ? 0 : 900;
    const wait = Math.max(0, MIN_BOOT_MS - (Date.now() - bootStart));
    setTimeout(()=>{
      boot.classList.add('boot-out');
      document.querySelector('.shell')?.classList.add('shell-in');
      setTimeout(()=>boot.remove(), reduced ? 0 : 520);
    }, wait);
  }
  // honor the manifest's home-screen shortcuts (long-press the app icon)
  const shortcutAction = new URLSearchParams(location.search).get('a');
  if(shortcutAction === 'workout') openWorkoutForm();
  if(shortcutAction === 'meal') switchTab('fuel'), setTimeout(()=>document.getElementById('aiQuickDesc')?.focus(),0);
})();
</script>
